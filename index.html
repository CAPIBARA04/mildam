<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A1C1F">
<title>밀담방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --wall:#1A1C1F; --foam:#24272B; --foam-2:#2E3237; --seam:#3A3F45;
  --lamp:#E9A83A; --lamp-soft:rgba(233,168,58,.14); --tally:#D8423A;
  --paper:#ECE6DA; --dim:#9A968E; --steel:#6F7782; --ok:#6FB287;
  --r-lg:16px; --r-md:12px; --r-sm:8px;
  --serif:"Nanum Myeongjo",serif; --sans:"Noto Sans KR",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100dvh; color:var(--paper); font:15px/1.6 var(--sans);
  background:
    radial-gradient(ellipse 70% 38% at 50% 0%, var(--lamp-soft), transparent 72%),
    var(--wall);
  -webkit-tap-highlight-color:transparent;
}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(24px + var(--safe-b))}
h1,h2,h3{font-family:var(--serif);font-weight:800;margin:0;letter-spacing:-.01em}
.muted{color:var(--dim)} .small{font-size:13px} .center{text-align:center}
.num{font-variant-numeric:tabular-nums}

/* acoustic foam texture */
.foam{
  background-color:var(--foam);
  background-image:
    linear-gradient(45deg, rgba(255,255,255,.025) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.025) 75%),
    linear-gradient(45deg, rgba(0,0,0,.18) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.18) 75%);
  background-size:18px 18px; background-position:0 0, 9px 9px;
}
.panel{border:1px solid var(--seam);border-radius:var(--r-lg);padding:16px;margin:12px 0;background:var(--foam)}
.panel h2{font-size:18px;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap-row{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* lamp header */
.lampbar{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
.lampbar svg{width:64px;height:40px}
.brand{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:.04em;margin-top:4px}
.brand-sub{color:var(--dim);font-size:13px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:48px;padding:10px 16px;border-radius:var(--r-md);border:1px solid var(--seam);
  background:var(--foam-2);cursor:pointer;font-weight:700;text-decoration:none;
}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--lamp);border-color:var(--lamp);color:#1d1407}
.btn.danger{background:transparent;border-color:var(--tally);color:#F2A49E}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
input[type=text],input[type=number],textarea,select{
  width:100%;min-height:48px;padding:10px 12px;border-radius:var(--r-md);
  border:1px solid var(--seam);background:#15171A;outline:none;font-size:16px;
}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--lamp)}
textarea{min-height:88px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--dim);margin:12px 0 6px}

.demo{border:1px dashed var(--lamp);color:var(--lamp);border-radius:var(--r-md);padding:10px 12px;font-size:13px;margin:8px 0}

/* status lights */
.tally{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.tally i{width:10px;height:10px;border-radius:50%;background:var(--steel);display:inline-block}
.tally.on i{background:var(--tally);box-shadow:0 0 0 3px rgba(216,66,58,.18),0 0 12px var(--tally)}
.tally.on{color:#F2A49E}
.tally.idle i{background:var(--ok)}
.tally.off i{background:#555}
@media (prefers-reduced-motion:no-preference){ .tally.on i{animation:pulse 1.6s ease-in-out infinite} }
@keyframes pulse{50%{opacity:.45}}

.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--seam)}
.list li:first-child{border-top:0}
.who{font-weight:700}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;border:1px solid var(--seam);color:var(--dim)}
.chip.gm{border-color:var(--lamp);color:var(--lamp)}
.chip.red{border-color:var(--tally);color:#F2A49E}

.req{border:1px solid var(--lamp);border-radius:var(--r-md);padding:12px;margin:8px 0;background:rgba(233,168,58,.07)}
.notice{border-left:3px solid var(--lamp);padding:8px 12px;margin:8px 0;background:rgba(233,168,58,.06);border-radius:0 var(--r-sm) var(--r-sm) 0}

/* ===== sealed room (chat) ===== */
.room{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto}
.door{
  padding:12px 16px 14px;border-bottom:1px solid var(--seam);
  background:linear-gradient(#202327,#1A1C1F);
}
.door .top{display:flex;justify-content:space-between;align-items:center}
.sign{
  display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:6px;
  background:#2a1210;border:1px solid #5a2420;color:#F2A49E;font-weight:700;font-size:13px;
}
.sign i{width:8px;height:8px;border-radius:50%;background:var(--tally);box-shadow:0 0 10px var(--tally)}
.clock{font:800 44px/1.1 var(--serif);text-align:center;margin-top:8px;color:var(--lamp)}
.clock.warn{color:var(--tally)}
.members{text-align:center;color:var(--dim);font-size:13px}
.msgs{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.msg{max-width:82%;margin:6px 0;padding:8px 12px;border-radius:14px;background:var(--foam-2);word-break:break-word;white-space:pre-wrap}
.msg .by{display:block;font-size:12px;color:var(--dim);margin-bottom:2px}
.msg.me{margin-left:auto;background:#3a2d16;border:1px solid #5c4520}
.msg.gm{border:1px solid var(--lamp)}
.msg.gm .by{color:var(--lamp)}
.msg.sys{max-width:100%;background:transparent;text-align:center;color:var(--dim);font-size:13px;padding:4px}
.msg.sys.alert{color:#F2A49E;font-weight:700}
.composer{
  display:flex;gap:8px;padding:10px 12px calc(10px + var(--safe-b));
  border-top:1px solid var(--seam);background:#17191C;
}
.composer input{flex:1}
.composer .btn{min-width:64px}

/* overlay + toast */
.sheet{position:fixed;inset:0;background:rgba(10,10,12,.72);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.show{display:flex}
.sheet .box{width:100%;max-width:560px;max-height:88dvh;overflow:auto;background:var(--foam);border:1px solid var(--seam);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--safe-b))}
.pick{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--seam);border-radius:var(--r-md);margin:8px 0;cursor:pointer;min-height:52px}
.pick.sel{border-color:var(--lamp);background:rgba(233,168,58,.08)}
.pick.busy{opacity:.45;cursor:not-allowed}
.pick input{width:20px;height:20px;accent-color:var(--lamp)}
.toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:30;pointer-events:none}
.toast{max-width:92%;background:#2b2e33;border:1px solid var(--lamp);padding:10px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);font-weight:500}
.toast.red{border-color:var(--tally)}

/* GM console */
.tabs{position:sticky;top:0;z-index:10;display:flex;gap:4px;padding:8px 0;background:var(--wall)}
.tabs button{flex:1;min-height:44px;border-radius:var(--r-md);border:1px solid var(--seam);background:transparent;font-weight:700;font-size:14px;cursor:pointer;position:relative}
.tabs button.on{background:var(--foam-2);border-color:var(--lamp);color:var(--lamp)}
.badge{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--tally);color:#fff;font-size:12px;line-height:20px}
.code{font:800 40px/1 var(--serif);letter-spacing:.18em;color:var(--lamp);text-align:center;margin:6px 0}
#qr{display:flex;justify-content:center;margin:12px 0}
#qr img,#qr canvas{background:#fff;padding:8px;border-radius:8px;max-width:200px}
.case{border:1px solid var(--seam);border-radius:var(--r-md);padding:12px;margin:10px 0;background:#1E2024}
.case.live{border-color:#5a2420}
.case .t{font:800 26px/1 var(--serif);color:var(--lamp)}
.case .t.warn{color:var(--tally)}
.q{border:1px solid var(--seam);border-radius:var(--r-md);padding:12px;margin:10px 0}
.q.new{border-color:var(--tally);background:rgba(216,66,58,.06)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:42px;padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--seam);background:transparent;cursor:pointer;font-weight:700}
.seg button.on{border-color:var(--lamp);color:var(--lamp);background:rgba(233,168,58,.08)}
/* 추리노트 */
.note-tabs{display:flex;gap:6px;margin:10px 0}
.note-tabs button{flex:1;min-height:42px;border-radius:var(--r-md);border:1px solid var(--seam);background:transparent;font-weight:700;cursor:pointer}
.note-tabs button.on{border-color:var(--lamp);color:var(--lamp);background:rgba(233,168,58,.08)}
.note textarea{font-size:16px;line-height:1.6;background:#15171A}
.note .free{min-height:46dvh}
.suspect{border:1px solid var(--seam);border-radius:var(--r-md);padding:12px;margin:10px 0;background:#1E2024}
.suspect.s3{border-color:var(--tally)} .suspect.s2{border-color:var(--lamp)}
.suspect textarea{min-height:52px}
.sus{display:flex;gap:4px;margin:8px 0}
.sus button{flex:1;min-height:36px;border-radius:8px;border:1px solid var(--seam);background:transparent;font-size:13px;font-weight:700;cursor:pointer}
.sus button.on.l0{border-color:var(--steel);color:var(--paper)}
.sus button.on.l1{border-color:var(--ok);color:var(--ok)}
.sus button.on.l2{border-color:var(--lamp);color:var(--lamp)}
.sus button.on.l3{border-color:var(--tally);color:#F2A49E;background:rgba(216,66,58,.1)}
.saved{font-size:12px;color:var(--dim);min-height:18px}
/* GM 상황판 */
.between{justify-content:space-between}
.ph-now{text-align:center;padding:6px 0 2px}
.ph-name{font:800 28px/1.25 var(--serif)}
.ph-clock{font:800 60px/1.05 var(--serif);color:var(--lamp);margin:4px 0}
.ph-clock.warn,.ph-clock.over{color:var(--tally)}
.ph-bar{display:flex;gap:4px;margin:12px 0 14px}
.ph-bar span{flex:1;height:6px;border-radius:3px;background:var(--seam)}
.ph-bar span.done{background:var(--lamp);opacity:.45}
.ph-bar span.cur{background:var(--lamp)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--seam);border-radius:var(--r-md);padding:10px 6px;text-align:center;background:#1E2024;cursor:pointer;font-size:13px;color:var(--dim)}
.stat b{display:block;font:800 26px/1.15 var(--serif);color:var(--lamp)}
.stat.alert{border-color:var(--tally)} .stat.alert b{color:var(--tally)}
.pl-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--seam)}
.pl-row:first-child{border-top:0}
.chars{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.char{border:1px solid var(--seam);border-radius:var(--r-md);overflow:hidden;background:#1E2024;cursor:pointer;text-align:left;padding:0;color:inherit}
.char .ph{aspect-ratio:1/1;background:#15171A center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--steel);font:800 34px var(--serif)}
.char .tx{padding:8px 10px}
.char .tx .who{display:block}
.pages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.page{aspect-ratio:3/4;border:1px solid var(--seam);border-radius:8px;background:#15171A center/cover no-repeat;position:relative;cursor:pointer;padding:0}
.page span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.65);border-radius:6px;padding:0 6px;font-size:12px;color:#fff}
.pv{max-height:60dvh;overflow:auto;border-radius:10px;background:#0f1012;margin:10px 0}
.pv img{display:block;width:100%;height:auto}
.pv.zoom img{width:230%;max-width:none}
.ph-list .row{margin:8px 0}
.ph-list input.min{width:78px;flex:none;text-align:center}
.char-photo{width:96px;height:96px;border-radius:12px;background:#15171A center/cover no-repeat;border:1px dashed var(--seam);display:flex;align-items:center;justify-content:center;color:var(--steel);flex:none}
.phase-banner{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--seam);border-radius:var(--r-md);padding:10px 14px;margin:8px 0;background:var(--foam)}
.phase-banner b{font-family:var(--serif)}
.phase-banner .num{font:800 22px var(--serif);color:var(--lamp)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch button{min-width:92px}
hr.seam{border:0;border-top:1px solid var(--seam);margin:14px 0}
</style>
</head>
<body>

<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>

<script type="module">
/* =========================================================
   ① Firebase 설정 — 설정 가이드대로 복사한 값을 붙여넣으세요.
   비워두면 '데모 모드'(이 기기 브라우저 탭끼리만 연결)로 실행돼요.
   ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDA3iJpe93NTm1kaCohbWBQ_0VMZ2XyXq0",
  authDomain: "mildam-d2605.firebaseapp.com",
  databaseURL: "https://mildam-d2605-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mildam-d2605",
  appId: "1:629595413666:web:42cecd7d7c3853bf6e8bfb"
};

const params = new URLSearchParams(location.search);
const DEMO = !FIREBASE_CONFIG.databaseURL || params.get("demo") === "1";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = (n = 8) => { const a = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s = ""; const r = crypto.getRandomValues(new Uint8Array(n)); for (const x of r) s += a[x % a.length]; return s; };
const fmt = ms => { ms = Math.max(0, ms); const t = Math.ceil(ms / 1000); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; };
const durTxt = s => s < 60 ? `${s}초` : s % 60 ? `${Math.floor(s / 60)}분 ${s % 60}초` : `${s / 60}분`;
const hhmm = t => t ? new Date(t).toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit"}) : "";
const idStore = DEMO ? sessionStorage : localStorage;

/* ===================== 저장소 (Firebase / 데모) ===================== */
const TS = {".sv": "timestamp"};
function splitPath(p) { return p.split("/").filter(Boolean); }
function getAt(tree, path) { let v = tree; for (const k of splitPath(path)) { if (v == null) return null; v = v[k]; } return v ?? null; }
function setAt(tree, path, val) {
  const ks = splitPath(path); let o = tree;
  for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== "object" || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
  if (val === null || val === undefined) delete o[ks.at(-1)]; else o[ks.at(-1)] = val;
}
function resolveTS(v) {
  if (v && typeof v === "object") { if (v[".sv"] === "timestamp") return Date.now(); const o = Array.isArray(v) ? [] : {}; for (const k in v) o[k] = resolveTS(v[k]); return o; }
  return v;
}

function demoStore() {
  const KEY = "mildam_demo_v1"; const subs = new Set();
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; } };
  let bc = null; try { bc = new BroadcastChannel("mildam"); bc.onmessage = notify; } catch {}
  function write(tree) { localStorage.setItem(KEY, JSON.stringify(tree)); try { bc && bc.postMessage(1); } catch {} notify(); }
  function notify() { const t = read(); for (const s of subs) { const v = getAt(t, s.path); const j = JSON.stringify(v); if (j !== s.last) { s.last = j; s.cb(v == null ? null : JSON.parse(j)); } } }
  addEventListener("storage", e => { if (e.key === KEY) notify(); });
  setInterval(notify, 800);
  return {
    TS, offset: () => 0,
    async get(p) { return getAt(read(), p); },
    async set(p, v) { const t = read(); setAt(t, p, resolveTS(v)); write(t); },
    async update(p, obj) { const t = read(); for (const k in obj) setAt(t, p + "/" + k, resolveTS(obj[k])); write(t); },
    async push(p, v) { const k = Date.now().toString(36) + rid(4); const t = read(); setAt(t, p + "/" + k, resolveTS(v)); write(t); return k; },
    async remove(p) { const t = read(); setAt(t, p, null); write(t); },
    on(p, cb) { const s = {path: p, cb, last: undefined}; subs.add(s); setTimeout(notify, 0); return () => subs.delete(s); },
    async tx(p, fn) { const t = read(); const nv = fn(getAt(t, p)); if (nv === undefined) return false; setAt(t, p, resolveTS(nv)); write(t); return true; },
    presence() {},
  };
}

async function firebaseStore() {
  const A = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const D = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
  const app = A.initializeApp(FIREBASE_CONFIG); const db = D.getDatabase(app);
  let off = 0; D.onValue(D.ref(db, ".info/serverTimeOffset"), s => off = s.val() || 0);
  const fix = v => { if (v && typeof v === "object") { if (v[".sv"] === "timestamp") return D.serverTimestamp(); const o = {}; for (const k in v) o[k] = fix(v[k]); return o; } return v; };
  return {
    TS, offset: () => off,
    async get(p) { return (await D.get(D.ref(db, p))).val(); },
    set: (p, v) => D.set(D.ref(db, p), fix(v)),
    update: (p, obj) => D.update(D.ref(db, p), fix(obj)),
    async push(p, v) { const r = D.push(D.ref(db, p)); await D.set(r, fix(v)); return r.key; },
    remove: p => D.remove(D.ref(db, p)),
    on: (p, cb) => D.onValue(D.ref(db, p), s => cb(s.val())),
    async tx(p, fn) { const r = await D.runTransaction(D.ref(db, p), cur => { const nv = fn(cur); return nv === undefined ? undefined : fix(nv); }); return r.committed; },
    presence(p) {
      D.onValue(D.ref(db, ".info/connected"), s => { if (s.val()) { D.onDisconnect(D.ref(db, p)).set(false); D.set(D.ref(db, p), true); } });
    },
  };
}

let S; // store
const now = () => Date.now() + S.offset();

/* ===================== 알림음 · 진동 · 토스트 ===================== */
let actx = null;
function unlockAudio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } if (actx && actx.state === "suspended") actx.resume(); }
addEventListener("pointerdown", unlockAudio, {passive: true});
function chime(kind = "soft") {
  const pattern = {soft: [[660, .12]], alert: [[880, .14], [0, .06], [880, .14], [0, .06], [1175, .22]], end: [[523, .18], [392, .3]]}[kind];
  if (actx) { let t = actx.currentTime;
    for (const [f, d] of pattern) { if (f) { const o = actx.createOscillator(), g = actx.createGain(); o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.25, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + .02); } t += d; } }
  try { navigator.vibrate && navigator.vibrate(kind === "alert" ? [180, 80, 180, 80, 260] : 120); } catch {}
}
function toast(msg, red = false, ms = 3600) {
  const el = document.createElement("div"); el.className = "toast" + (red ? " red" : ""); el.textContent = msg;
  $("#toasts").appendChild(el); setTimeout(() => el.remove(), ms);
}

const nameOf = pid => pid === "GM" ? "GM" : (R?.players?.[pid]?.name || "(나간 사람)");
const entries = o => Object.entries(o || {});
const liveChats = () => entries(R?.chats).filter(([, c]) => c.status === "live");
const membersOf = c => Object.keys(c.members || {});

async function sysMsg(cid, text, alert = false) { await S.push(`${roomPath()}/messages/${cid}`, {from: "SYS", text, at: S.TS, alert}); }

async function endChat(cid, reason) {
  let mem = [];
  const ok = await S.tx(`${roomPath()}/chats/${cid}`, c => { if (!c || c.status !== "live") return undefined; mem = Object.keys(c.members || {}); return {...c, status: "ended", endedAt: now(), endReason: reason}; });
  if (!ok) return;
  await sysMsg(cid, reason === "time" ? "밀담 시간이 끝났습니다. 모두 방에서 나갔어요." : reason === "gm" ? "GM이 밀담을 종료했습니다." : "밀담이 종료되었습니다.", true);
  const up = {}; for (const p of mem) if (R?.players?.[p]?.busy === cid) up[`players/${p}/busy`] = null;
  if (Object.keys(up).length) await S.update(roomPath(), up);
}

/* 시간 감시: 참가자·GM 어느 기기든 먼저 감지한 쪽이 처리 (중복 방지) */
async function watchClocks(scope) {
  for (const [cid, c] of liveChats()) {
    if (scope && !scope(c)) continue;
    const rem = c.endAt - now();
    if (rem <= 0) { endChat(cid, "time"); continue; }
    if (rem <= 60000 && !c.w60) { if (await S.tx(`${roomPath()}/chats/${cid}/w60`, v => v ? undefined : true)) sysMsg(cid, "⏰ 1분 남았습니다", true); }
    if (rem <= 10000 && !c.w10) { if (await S.tx(`${roomPath()}/chats/${cid}/w10`, v => v ? undefined : true)) sysMsg(cid, "10초 후 자동으로 퇴장됩니다", true); }
  }
}

function msgsHTML(cid, me) {
  const list = sorted(R?.messages?.[cid]);
  if (!list.length) return `<p class="muted center small">아직 대화가 없어요.</p>`;
  return list.map(([, m]) => {
    if (m.from === "SYS") return `<div class="msg sys${m.alert ? " alert" : ""}">${esc(m.text)}</div>`;
    const cls = m.from === me ? "me" : m.from === "GM" ? "gm" : "";
    return `<div class="msg ${cls}"><span class="by">${esc(nameOf(m.from))} · ${hhmm(m.at)}</span>${esc(m.text)}</div>`;
  }).join("");
}
function paintMsgs(el, cid, me) {
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  const html = msgsHTML(cid, me); if (el._h === html) return; el._h = html; el.innerHTML = html;
  if (atBottom || !el._init) { el.scrollTop = el.scrollHeight; el._init = true; }
}

async function acceptReq(rk) {
  await S.set(`${roomPath()}/requests/${rk}/accepted/${pid}`, true);
  const r = await S.get(`${roomPath()}/requests/${rk}`);
  const need = [r.from, ...Object.keys(r.to || {})];
  if (r.status === "pending" && need.every(x => r.accepted?.[x])) startChat(rk, need);
}
async function startChat(rk, mem) {
  const players = await S.get(`${roomPath()}/players`) || {};
  const busy = mem.filter(x => players[x]?.busy);
  if (busy.length) { await S.update(`${roomPath()}/requests/${rk}`, {status: "failed", why: `${busy.map(nameOf).join(", ")} 님이 이미 밀담 중이에요`}); return; }
  if (!await S.tx(`${roomPath()}/requests/${rk}/status`, s => s === "pending" ? "started" : undefined)) return;
  const meta = await S.get(`${roomPath()}/meta`); const dur = meta.duration || 180;
  const members = {}; mem.forEach(x => members[x] = true);
  const t = now();
  const cid = await S.push(`${roomPath()}/chats`, {members, startAt: t, endAt: t + dur * 1000, duration: dur, status: "live", w60: dur <= 60, w10: dur <= 10, req: rk});
  const up = {}; mem.forEach(x => up[`players/${x}/busy`] = cid); up[`requests/${rk}/chat`] = cid;
  await S.update(roomPath(), up);
  await sysMsg(cid, `문이 닫혔습니다. 방음 중 · ${durTxt(dur)}`);
}

function paintLobby() {
  const meta = R.meta, me = R.players[pid];
  $("#pTitle").textContent = meta.title; $("#pName").textContent = me.name;
  // 공지
  const ns = sorted(R.notices);

  P.notices = ns.length;
  paintPlayerPhase();
  $("#pNotice").innerHTML = ns.slice(-2).reverse().map(([, n]) => `<div class="notice"><span class="small muted">GM 공지 · ${hhmm(n.at)}</span><br>${esc(n.text)}</div>`).join("");
  // 받은 요청
  const reqs = entries(R.requests).filter(([, r]) => r.status === "pending");
  const incoming = reqs.filter(([, r]) => r.to?.[pid] && !r.accepted?.[pid] && now() - (r.t0 || 0) < 60000);
  for (const [k] of incoming) if (!P.reqSeen[k]) { P.reqSeen[k] = 1; chime("alert"); toast("밀담 요청이 왔어요!"); }
  $("#pReqs").innerHTML = incoming.map(([k, r]) => {
    const others = Object.keys(r.to).filter(x => x !== pid).map(nameOf);
    return `<div class="req"><b>${esc(nameOf(r.from))}</b> 님이 밀담을 요청했어요${others.length ? ` <span class="muted small">(함께: ${others.map(esc).join(", ")})</span>` : ""}
      <div class="row" style="margin-top:10px"><button class="btn danger grow" data-dec="${k}">거절</button><button class="btn primary grow" data-acc="${k}">수락</button></div></div>`;
  }).join("");
  $("#pReqs").onclick = async e => {
    const a = e.target.closest("[data-acc]"), d = e.target.closest("[data-dec]");

  };
  // 보낸 요청
  const mine = entries(R.requests).filter(([, r]) => r.from === pid).sort((a, b) => (b[1].t0 || 0) - (a[1].t0 || 0))[0];
  let out = "";
  if (mine) {
    const [k, r] = mine; const age = now() - (r.t0 || 0);
    const names = Object.keys(r.to).map(nameOf).join(", ");
    if (r.status === "pending" && age >= 60000) { S.update(`${roomPath()}/requests/${k}`, {status: "expired"}); }
    if (r.status === "pending") out = `<div class="req" style="margin-top:12px"><span class="small">${esc(names)} 님의 수락을 기다리는 중…</span>
      <div class="muted small">${Object.keys(r.to).map(x => `${esc(nameOf(x))}: ${r.accepted?.[x] ? "수락" : "대기"}`).join(" / ")}</div>
      <button class="btn sm ghost" data-cancel="${k}" style="margin-top:8px">요청 취소</button></div>`;
    else if (["declined", "expired", "failed"].includes(r.status) && !P.reqSeen["out" + k] && age < 120000) {
      P.reqSeen["out" + k] = 1;
      toast(r.status === "declined" ? `${nameOf(r.by)} 님이 밀담을 거절했어요.` : r.status === "expired" ? "응답이 없어 요청이 취소됐어요." : (r.why || "밀담을 시작할 수 없어요."), true);
    }
  }
  $("#pOut").innerHTML = out;
  $("#pOut").onclick = e => { const c = e.target.closest("[data-cancel]"); if (c) S.update(`${roomPath()}/requests/${c.dataset.cancel}`, {status: "cancelled"}); };
  const pendingMine = mine && mine[1].status === "pending";
  $("#reqBtn").disabled = !meta.open || pendingMine || !!me.busy;
  $("#pOpenTxt").textContent = !meta.open ? "지금은 밀담 시간이 아니에요. GM이 열면 요청할 수 있어요." : `한 번에 ${durTxt(meta.duration || 180)} 동안 2~3명이 비밀로 대화해요. 끝나면 자동으로 나와요.`;
  // 질문
  const qs = myQs(); qs.forEach(([k, q]) => { if (q.answer) P.qRead[k] = 1; });
  $("#pQs").innerHTML = qHTML(qs);
  // 참가자
  $("#pPlayers").innerHTML = entries(R.players).map(([k, p]) => `<li><span class="grow"><span class="who">${esc(p.name)}</span>${k === pid ? ` <span class="chip">나</span>` : ""}</span>
    ${p.busy ? `<span class="tally on"><i></i>밀담 중</span>` : R.online?.[k] === false ? `<span class="tally off"><i></i>연결 끊김</span>` : `<span class="tally idle"><i></i>대기</span>`}</li>`).join("");
  // 기록
  const logs = entries(R.chats).filter(([, c]) => c.status === "ended" && c.members?.[pid]).sort((a, b) => (b[1].startAt || 0) - (a[1].startAt || 0));
  $("#pLogs").innerHTML = logs.length ? logs.map(([k, c]) => `<button class="btn block ghost" data-log="${k}" style="margin:6px 0;justify-content:space-between">
     <span>${membersOf(c).filter(x => x !== pid).map(nameOf).map(esc).join(", ")}</span><span class="muted small">${hhmm(c.startAt)}</span></button>`).join("") : `<p class="muted small">끝난 밀담의 대화는 여기서 다시 볼 수 있어요.</p>`;
  $("#pLogs").onclick = e => { const b = e.target.closest("[data-log]"); if (b) openLog(b.dataset.log, pid); };
  if ($("#pickList")) paintPick();
  paintMyQs();
}

/* GM 질문·답변: 로비와 밀담 중 모두에서 확인 */
function myQs() { return entries(R?.questions).filter(([, q]) => q.from === pid).sort((a, b) => (b[1].at || 0) - (a[1].at || 0)); }
function qHTML(qs) {
  return qs.map(([, q]) => `<div class="q"><div class="small muted">${hhmm(q.at)} 내 질문</div>${esc(q.text)}
    <hr class="seam">${q.answer ? `<div><span class="chip gm">GM 답변</span> ${esc(q.answer)}</div>` : `<div class="muted small">답변을 기다리는 중</div>`}</div>`).join("");
}
function checkAnswers() {
  for (const [k, q] of myQs()) if (q.answer && !P.answered[k]) {
    if (P.answered.__init) { chime("alert"); toast("💬 GM 답변: " + q.answer, false, 8000); }
    P.answered[k] = 1;
  }
  P.answered.__init = 1;
}
function openMyQs() {
  openSheet(`<div class="row" style="justify-content:space-between"><h2>내 질문</h2><button class="btn sm ghost" id="mqClose">닫기</button></div>

  const html = qs.length ? qHTML(qs) : `<p class="muted">아직 보낸 질문이 없어요.</p>`;

const noteKey = () => `mildam_note_${code}_${pid}`;

let noteTimer = null;
function saveNote(n) {
  clearTimeout(noteTimer);
  const st = $("#noteSaved"); if (st) st.textContent = "저장 중…";
  noteTimer = setTimeout(() => {
    try { localStorage.setItem(noteKey(), JSON.stringify(n)); if ($("#noteSaved")) $("#noteSaved").textContent = "이 폰에 저장됨 · " + hhmm(Date.now()); }
    catch { if ($("#noteSaved")) $("#noteSaved").textContent = "저장하지 못했어요 (브라우저 저장공간을 확인해 주세요)"; }
  }, 400);
}
const SUS = ["모름", "낮음", "중간", "높음"];
function openNote(tab) {

  openSheet(`<div class="note">

      }).join("") : `<p class="muted">다른 참가자가 들어오면 여기에 인물별 칸이 생겨요.</p>`;

function renderPlayer() {
  if (!R || !R.meta) { $("#app").innerHTML = `<div class="wrap"><section class="panel center"><h2>방을 찾을 수 없어요</h2><p class="muted">코드를 다시 확인하거나 GM에게 새 링크를 받아주세요.</p><a class="btn" href="?">처음으로</a></section></div>`; return; }
  if (!pid || !R.players?.[pid]) {

  }
  P.wasMember = true;
  checkAnswers();
  const my = liveChats().find(([, c]) => c.members?.[pid]);

function paintPlayerPhase() {
  const box = $("#pPhase"); if (!box) return;

  if (P.phIdx != null && P.phIdx !== ph.idx) { chime("soft"); toast(done ? "모든 단계가 끝났어요." : `다음 단계: ${ph.list[ph.idx].n}`); }
  P.phIdx = ph.idx;
  box.innerHTML = done ? "" : `<div class="phase-banner"><span><span class="small muted">STEP ${ph.idx + 1} · 현재 단계</span><br><b>${esc(ph.list[ph.idx].n)}</b></span><span class="num" id="pPhaseClock"></span></div>`;

}
function tickPlayerPhase() {
  const el = $("#pPhaseClock"); if (!el || !R?.phase) return;

function tickGM() {
  if (!R) return;
  document.querySelectorAll("[data-clock]").forEach(el => { const c = R.chats?.[el.dataset.clock]; if (!c) return; const rem = c.endAt - now(); el.textContent = fmt(rem); el.classList.toggle("warn", rem <= 60000); });
  if (G.open) { const c = R.chats?.[G.open]; if (c?.status === "live") $("#gcSub") && ($("#gcSub").textContent = `방음 중 · 남은 시간 ${fmt(c.endAt - now())}`); }
  watchClocks();
  tickPhase();
}

/* ===================== 진행 단계 (서버 저장: 플레이어도 보는 정보) ===================== */
const DEFAULT_PHASES = [["설명", 10], ["읽기", 20], ["자기소개", 10], ["조사·토론", 60], ["투표", 10], ["엔딩", 20]].map(([n, m]) => ({n, m}));
function phaseRem(ph) {
  if (!ph?.list?.length) return null;
  if (ph.idx >= ph.list.length) return 0;
  return ph.run ? ph.endAt - now() : (ph.left ?? ph.list[ph.idx].m * 60000);
}
const phasePath = () => `${roomPath()}/phase`;
async function setPhase(fn) { await S.tx(phasePath(), cur => fn(cur || {list: DEFAULT_PHASES, idx: 0, run: false, left: DEFAULT_PHASES[0].m * 60000})); }
const phaseAct = {
  toggle: () => setPhase(ph => { const r = phaseRem(ph); if (ph.idx >= ph.list.length) return undefined; return ph.run ? {...ph, run: false, left: Math.max(0, r)} : {...ph, run: true, endAt: now() + Math.max(0, r), left: null}; }),
  next: () => setPhase(ph => { const i = ph.idx + 1; if (i > ph.list.length) return undefined; return i >= ph.list.length ? {...ph, idx: i, run: false, left: 0} : {...ph, idx: i, run: true, endAt: now() + ph.list[i].m * 60000, left: null}; }),
  prev: () => setPhase(ph => { const i = Math.max(0, ph.idx - 1); return {...ph, idx: i, run: false, left: ph.list[i].m * 60000}; }),
  plus: () => setPhase(ph => ph.idx >= ph.list.length ? undefined : ph.run ? {...ph, endAt: ph.endAt + 60000} : {...ph, left: (phaseRem(ph) || 0) + 60000}),
  reset: () => setPhase(ph => ph.idx >= ph.list.length ? undefined : {...ph, run: false, left: ph.list[ph.idx].m * 60000}),
};
function tickPhase() {
  const ph = R?.phase; if (!ph?.list) return;
  const rem = phaseRem(ph); const cur = ph.list[ph.idx];
  const el = $("#phClock");
  if (el) { el.textContent = ph.idx >= ph.list.length ? "끝" : (rem < 0 ? "-" : "") + fmt(Math.abs(rem)); el.classList.toggle("warn", rem <= 60000 && rem > 0); el.classList.toggle("over", rem <= 0 && ph.idx < ph.list.length); }
  if (!ph.run || !cur) return;
  const key = ph.idx + ":" + ph.endAt;
  if (rem <= 60000 && rem > 0 && cur.m > 1 && G.ph1 !== key) { G.ph1 = key; chime("alert"); toast(`⏰ '${cur.n}' 단계 1분 남았어요`, true); }
  if (rem <= 0 && G.ph0 !== key) { G.ph0 = key; chime("end"); toast(`'${cur.n}' 단계 시간이 끝났어요. 다음 단계로 넘겨주세요.`, true, 7000); }
}

/* ===================== GM 기기 전용 저장소 (캐릭터·설정서: 서버로 보내지 않음) ===================== */
const IDB = (() => {
  let p;
  const open = () => p ||= new Promise((res, rej) => { const r = indexedDB.open("mildam_gm", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("kv", mode); const rq = fn(t.objectStore("kv")); t.oncomplete = () => res(rq?.result); t.onerror = () => rej(t.error); }); };
  return {get: k => run("readonly", st => st.get(k)), set: (k, v) => run("readwrite", st => st.put(v, k))};
})();
const urls = new WeakMap();
const urlOf = b => { if (!b) return ""; if (!urls.has(b)) urls.set(b, URL.createObjectURL(b)); return urls.get(b); };
async function shrink(file, max = 1600) {
  try {
    const bm = await createImageBitmap(file); const k = Math.min(1, max / Math.max(bm.width, bm.height));
    const c = document.createElement("canvas"); c.width = Math.round(bm.width * k); c.height = Math.round(bm.height * k);
    c.getContext("2d").drawImage(bm, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", .86));
  } catch { return file; }
}
async function loadGD() {
  if (G.gd) return G.gd;
  try { G.gd = {chars: (await IDB.get("chars")) || [], pages: (await IDB.get("pages")) || []}; try { navigator.storage?.persist?.(); } catch {} }
  catch { G.gd = {chars: [], pages: [], fail: true}; }
  return G.gd;
}
async function saveGD(k) { try { await IDB.set(k, G.gd[k]); } catch { toast("이 기기에 저장하지 못했어요. 저장공간을 확인해 주세요.", true); } }

  $("#pvDel").onclick = async () => { if (!confirm("이 사진을 설정서에서 뺄까요?")) return; gd.pages.splice(i, 1); await saveGD("pages"); paintGD(); gd.pages.length ? openPage(Math.min(i, gd.pages.length - 1)) : closeSheet(); };
  let sx = null; const pv = $("#pv");
  pv.ontouchstart = e => { sx = pv.classList.contains("zoom") || e.touches.length > 1 ? null : e.touches[0].clientX; };
  pv.ontouchend = e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 60) openPage(i + (dx < 0 ? 1 : -1)); };
}

/* ===================== 시작 ===================== */
(async () => {
  try { S = DEMO ? demoStore() : await firebaseStore(); }
  catch (e) { $("#app").innerHTML = `<div class="wrap"><section class="panel"><h2>연결하지 못했어요</h2><p class="muted">Firebase 설정값을 다시 확인해 주세요.</p><pre class="small muted">${esc(e.message)}</pre></section></div>`; return; }
  if (!code) return viewHome();
  const gmKey = params.get("gm");
  const meta = await S.get(`${roomPath()}/meta`);
  if (gmKey && meta && meta.gmKey === gmKey) {
    shellGM();
    S.on(roomPath(), v => { R = v; if (!R?.meta) { $("#app").innerHTML = `<div class="wrap"><section class="panel center"><h2>방이 삭제됐어요</h2><a class="btn" href="?">처음으로</a></section></div>`; return; } paintGM(); });
    setInterval(tickGM, 500);
    return;
  }
  pid = idStore.getItem(`mildam_pid_${code}`);
  if (pid) S.presence(`${roomPath()}/online/${pid}`);
  S.on(roomPath(), v => { R = v; renderPlayer(); });
  setInterval(tickPlayer, 500);
})();
</script>
