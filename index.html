<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A1C1F">
<title>밀담방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --wall:#1A1C1F; --foam:#24272B; --foam-2:#2E3237; --seam:#3A3F45;
  --lamp:#E9A83A; --lamp-soft:rgba(233,168,58,.14); --tally:#D8423A;
  --paper:#ECE6DA; --dim:#9A968E; --steel:#6F7782; --ok:#6FB287;
  --r-lg:16px; --r-md:12px; --r-sm:8px;
  --serif:"Nanum Myeongjo",serif; --sans:"Noto Sans KR",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100dvh; color:var(--paper); font:15px/1.6 var(--sans);
  background:
    radial-gradient(ellipse 70% 38% at 50% 0%, var(--lamp-soft), transparent 72%),
    var(--wall);
  -webkit-tap-highlight-color:transparent;
}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(24px + var(--safe-b))}
h1,h2,h3{font-family:var(--serif);font-weight:800;margin:0;letter-spacing:-.01em}
.muted{color:var(--dim)} .small{font-size:13px} .center{text-align:center}
.num{font-variant-numeric:tabular-nums}

/* acoustic foam texture */
.foam{
  background-color:var(--foam);
  background-image:
    linear-gradient(45deg, rgba(255,255,255,.025) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.025) 75%),
    linear-gradient(45deg, rgba(0,0,0,.18) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.18) 75%);
  background-size:18px 18px; background-position:0 0, 9px 9px;
}
.panel{border:1px solid var(--seam);border-radius:var(--r-lg);padding:16px;margin:12px 0;background:var(--foam)}
.panel h2{font-size:18px;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap-row{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* lamp header */
.lampbar{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
.lampbar svg{width:64px;height:40px}
.brand{font-family:var(--serif);font-size:34px;font-weight:800;letter-spacing:.04em;margin-top:4px}
.brand-sub{color:var(--dim);font-size:13px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:48px;padding:10px 16px;border-radius:var(--r-md);border:1px solid var(--seam);
  background:var(--foam-2);cursor:pointer;font-weight:700;text-decoration:none;
}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--lamp);border-color:var(--lamp);color:#1d1407}
.btn.danger{background:transparent;border-color:var(--tally);color:#F2A49E}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
input[type=text],textarea,select{
  width:100%;min-height:48px;padding:10px 12px;border-radius:var(--r-md);
  border:1px solid var(--seam);background:#15171A;outline:none;
}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--lamp)}
/* 아이폰은 16px보다 작은 입력창을 누르면 화면을 확대해요 */
input,textarea,select{font-size:16px!important}
textarea{min-height:88px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--dim);margin:12px 0 6px}

.demo{border:1px dashed var(--lamp);color:var(--lamp);border-radius:var(--r-md);padding:10px 12px;font-size:13px;margin:8px 0}

/* status lights */
.tally{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.tally i{width:10px;height:10px;border-radius:50%;background:var(--steel);display:inline-block}
.tally.on i{background:var(--tally);box-shadow:0 0 0 3px rgba(216,66,58,.18),0 0 12px var(--tally)}
.tally.on{color:#F2A49E}
.tally.idle i{background:var(--ok)}
.tally.off i{background:#555}
@media (prefers-reduced-motion:no-preference){ .tally.on i{animation:pulse 1.6s ease-in-out infinite} }
@keyframes pulse{50%{opacity:.45}}

.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--seam)}
.list li:first-child{border-top:0}
.who{font-weight:700}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;border:1px solid var(--seam);color:var(--dim)}
.chip.gm{border-color:var(--lamp);color:var(--lamp)}
.chip.red{border-color:var(--tally);color:#F2A49E}

.req{border:1px solid var(--lamp);border-radius:var(--r-md);padding:12px;margin:8px 0;background:rgba(233,168,58,.07)}
.notice{border-left:3px solid var(--lamp);padding:8px 12px;margin:8px 0;background:rgba(233,168,58,.06);border-radius:0 var(--r-sm) var(--r-sm) 0}

/* ===== sealed room (chat) ===== */
.room{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto}
.door{
  padding:12px 16px 14px;border-bottom:1px solid var(--seam);
  background:linear-gradient(#202327,#1A1C1F);
}
.door .top{display:flex;justify-content:space-between;align-items:center}
.sign{
  display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:6px;
  background:#2a1210;border:1px solid #5a2420;color:#F2A49E;font-weight:700;font-size:13px;
}
.sign i{width:8px;height:8px;border-radius:50%;background:var(--tally);box-shadow:0 0 10px var(--tally)}
.clock{font:800 44px/1.1 var(--serif);text-align:center;margin-top:8px;color:var(--lamp)}
.clock.warn{color:var(--tally)}
.members{text-align:center;color:var(--dim);font-size:13px}
.msgs{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.msg{max-width:82%;margin:6px 0;padding:8px 12px;border-radius:14px;background:var(--foam-2);word-break:break-word;white-space:pre-wrap}
.msg .by{display:block;font-size:12px;color:var(--dim);margin-bottom:2px}
.msg.me{margin-left:auto;background:#3a2d16;border:1px solid #5c4520}
.msg.gm{border:1px solid var(--lamp)}
.msg.gm .by{color:var(--lamp)}
.msg.sys{max-width:100%;background:transparent;text-align:center;color:var(--dim);font-size:13px;padding:4px}
.msg.sys.alert{color:#F2A49E;font-weight:700}
.composer{
  display:flex;gap:8px;padding:10px 12px calc(10px + var(--safe-b));
  border-top:1px solid var(--seam);background:#17191C;
}
.composer input{flex:1}
.composer .btn{min-width:64px}

/* overlay + toast */
.sheet{position:fixed;inset:0;background:rgba(10,10,12,.72);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.show{display:flex}
.sheet .box{width:100%;max-width:560px;max-height:88dvh;overflow:auto;background:var(--foam);border:1px solid var(--seam);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--safe-b))}
.pick{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--seam);border-radius:var(--r-md);margin:8px 0;cursor:pointer;min-height:52px}
.pick.sel{border-color:var(--lamp);background:rgba(233,168,58,.08)}
.pick.busy{opacity:.45;cursor:not-allowed}
.pick input{width:20px;height:20px;accent-color:var(--lamp)}
.toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:30;pointer-events:none}
.toast{max-width:92%;background:#2b2e33;border:1px solid var(--lamp);padding:10px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);font-weight:500}
.toast.red{border-color:var(--tally)}

/* GM console */
.tabs{position:sticky;top:0;z-index:10;display:flex;gap:4px;padding:8px 0;background:var(--wall)}
.tabs button{flex:1;min-height:44px;border-radius:var(--r-md);border:1px solid var(--seam);background:transparent;font-weight:700;font-size:14px;cursor:pointer;position:relative}
.tabs button.on{background:var(--foam-2);border-color:var(--lamp);color:var(--lamp)}
.badge{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--tally);color:#fff;font-size:12px;line-height:20px}
.code{font:800 40px/1 var(--serif);letter-spacing:.18em;color:var(--lamp);text-align:center;margin:6px 0}
#qr{display:flex;justify-content:center;margin:12px 0}
#qr img,#qr canvas{background:#fff;padding:8px;border-radius:8px;max-width:200px}
.case{border:1px solid var(--seam);border-radius:var(--r-md);padding:12px;margin:10px 0;background:#1E2024}
.case.live{border-color:#5a2420}
.case .t{font:800 26px/1 var(--serif);color:var(--lamp)}
.case .t.warn{color:var(--tally)}
.q{border:1px solid var(--seam);border-radius:var(--r-md);padding:12px;margin:10px 0}
.q.new{border-color:var(--tally);background:rgba(216,66,58,.06)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:42px;padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--seam);background:transparent;cursor:pointer;font-weight:700}
.seg button.on{border-color:var(--lamp);color:var(--lamp);background:rgba(233,168,58,.08)}
/* 추리노트 */
.note-tabs{display:flex;gap:6px;margin:10px 0}
.note-tabs button{flex:1;min-height:42px;border-radius:var(--r-md);border:1px solid var(--seam);background:transparent;font-weight:700;cursor:pointer}
.note-tabs button.on{border-color:var(--lamp);color:var(--lamp);background:rgba(233,168,58,.08)}
.note textarea{font-size:16px;line-height:1.6;background:#15171A}
.note .free{min-height:46dvh}
.suspect{border:1px solid var(--seam);border-radius:var(--r-md);padding:12px;margin:10px 0;background:#1E2024}
.suspect.s3{border-color:var(--tally)} .suspect.s2{border-color:var(--lamp)}
.suspect textarea{min-height:52px}
.sus{display:flex;gap:4px;margin:8px 0}
.sus button{flex:1;min-height:36px;border-radius:8px;border:1px solid var(--seam);background:transparent;font-size:13px;font-weight:700;cursor:pointer}
.sus button.on.l0{border-color:var(--steel);color:var(--paper)}
.sus button.on.l1{border-color:var(--ok);color:var(--ok)}
.sus button.on.l2{border-color:var(--lamp);color:var(--lamp)}
.sus button.on.l3{border-color:var(--tally);color:#F2A49E;background:rgba(216,66,58,.1)}
.saved{font-size:12px;color:var(--dim);min-height:18px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch button{min-width:92px}
hr.seam{border:0;border-top:1px solid var(--seam);margin:14px 0}
/* 연결 상태 */
.net{position:fixed;left:0;right:0;top:0;z-index:40;background:#5a2420;color:#fff;text-align:center;font-size:13px;font-weight:700;padding:6px calc(10px + env(safe-area-inset-right,0px)) 6px;display:none}
.net.show{display:block}
.left{font-variant-numeric:tabular-nums;color:var(--lamp);font-weight:700}
/* 밀담 화면 안 알림 띠 */
.cbanner{padding:0 12px}
.cbanner .notice{margin:8px 0 0}
.cbanner .btn{margin-top:8px}
.leave{margin-top:6px;text-align:center}
/* 투표 */
.vote{border:1px solid var(--lamp);border-radius:var(--r-md);padding:12px;margin:10px 0;background:rgba(233,168,58,.06)}
.vote h3{font-size:17px;margin-bottom:6px}
.bar{position:relative;border:1px solid var(--seam);border-radius:var(--r-sm);padding:8px 10px;margin:6px 0;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:rgba(233,168,58,.18)}
.bar.top i{background:rgba(216,66,58,.28)}
.bar span{position:relative}
.bar .cnt{float:right;font-weight:700}
.voters{display:block;font-size:12px;color:var(--dim);position:relative}
/* 캐릭터 고르기 */
.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.roster button{min-height:52px;border-radius:var(--r-md);border:1px solid var(--seam);background:var(--foam-2);font-weight:700;cursor:pointer;padding:6px}
.roster button small{display:block;font-weight:400;font-size:12px;color:var(--dim)}
.roster button.taken{border-color:var(--steel)}
.qa{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qa button{min-height:36px;padding:4px 10px;border-radius:999px;border:1px solid var(--seam);background:transparent;font-size:13px;cursor:pointer}
.stat{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--seam)}
.stat:first-child{border-top:0}
.stat .zero{color:#F2A49E}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>
<div class="toasts" id="toasts"></div>
<div class="net" id="net" role="status">연결이 끊겼어요. 다시 연결하는 중…</div>

<script type="module">
/* =========================================================
   ① Firebase 설정 — 설정 가이드대로 복사한 값을 붙여넣으세요.
   비워두면 '데모 모드'(이 기기 브라우저 탭끼리만 연결)로 실행돼요.
   ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDA3iJpe93NTm1kaCohbWBQ_0VMZ2XyXq0",
  authDomain: "mildam-d2605.firebaseapp.com",
  databaseURL: "https://mildam-d2605-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mildam-d2605",
  appId: "1:629595413666:web:42cecd7d7c3853bf6e8bfb"
};

const params = new URLSearchParams(location.search);
const DEMO = !FIREBASE_CONFIG.databaseURL || params.get("demo") === "1";
const DQ = params.get("demo") ? "&demo=1" : "";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = (n = 8) => { const a = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s = ""; const r = crypto.getRandomValues(new Uint8Array(n)); for (const x of r) s += a[x % a.length]; return s; };
const fmt = ms => { ms = Math.max(0, ms); const t = Math.ceil(ms / 1000); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; };
const durTxt = s => s < 60 ? `${s}초` : s % 60 ? `${Math.floor(s / 60)}분 ${s % 60}초` : `${s / 60}분`;
const hhmm = t => t ? new Date(t).toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit"}) : "";
const idStore = DEMO ? sessionStorage : localStorage;
const REQ_MS = 60000;                 // 밀담 요청은 60초 동안 유효
const DURS = [[30, "30초"], [60, "1분"], [120, "2분"], [180, "3분"], [300, "5분"], [420, "7분"], [600, "10분"]];
async function sha(s) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }

/* ===================== 저장소 (Firebase / 데모) ===================== */
const TS = {".sv": "timestamp"};
function splitPath(p) { return p.split("/").filter(Boolean); }
function getAt(tree, path) { let v = tree; for (const k of splitPath(path)) { if (v == null) return null; v = v[k]; } return v ?? null; }
function setAt(tree, path, val) {
  const ks = splitPath(path); let o = tree;
  for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== "object" || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
  if (val === null || val === undefined) delete o[ks.at(-1)]; else o[ks.at(-1)] = val;
}
function resolveTS(v) {
  if (v && typeof v === "object") {
    if (v[".sv"] === "timestamp") return Date.now();
    const o = Array.isArray(v) ? [] : {};
    for (const k in v) { const r = resolveTS(v[k]); if (r !== null && r !== undefined) o[k] = r; }   // Firebase처럼 null 칸은 지워요
    return o;
  }
  return v;
}

function demoStore() {
  const KEY = "mildam_demo_v1"; const subs = new Set();
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; } };
  let bc = null; try { bc = new BroadcastChannel("mildam"); bc.onmessage = notify; } catch {}
  function write(tree) { localStorage.setItem(KEY, JSON.stringify(tree)); try { bc && bc.postMessage(1); } catch {} notify(); }
  function notify() { const t = read(); for (const s of subs) { const v = getAt(t, s.path); const j = JSON.stringify(v); if (j !== s.last) { s.last = j; s.cb(v == null ? null : JSON.parse(j)); } } }
  addEventListener("storage", e => { if (e.key === KEY) notify(); });
  setInterval(notify, 800);
  return {
    TS, offset: () => 0,
    newKey: () => Date.now().toString(36) + rid(4),
    async get(p) { return getAt(read(), p); },
    async set(p, v) { const t = read(); setAt(t, p, resolveTS(v)); write(t); },
    async update(p, obj) { const t = read(); for (const k in obj) setAt(t, p + "/" + k, resolveTS(obj[k])); write(t); },
    async push(p, v) { const k = Date.now().toString(36) + rid(4); const t = read(); setAt(t, p + "/" + k, resolveTS(v)); write(t); return k; },
    async remove(p) { const t = read(); setAt(t, p, null); write(t); },
    on(p, cb) { const s = {path: p, cb, last: undefined}; subs.add(s); setTimeout(notify, 0); return () => subs.delete(s); },
    async tx(p, fn) { const t = read(); const nv = fn(getAt(t, p)); if (nv === undefined) return false; setAt(t, p, resolveTS(nv)); write(t); return true; },
    presence(p) { const t = read(); setAt(t, p, true); write(t); },
    connected(cb) { cb(true); },
  };
}

async function firebaseStore() {
  const A = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const D = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
  const app = A.initializeApp(FIREBASE_CONFIG); const db = D.getDatabase(app);
  let off = 0; D.onValue(D.ref(db, ".info/serverTimeOffset"), s => off = s.val() || 0);
  const fix = v => { if (v && typeof v === "object") { if (v[".sv"] === "timestamp") return D.serverTimestamp(); const o = Array.isArray(v) ? [] : {}; for (const k in v) o[k] = fix(v[k]); return o; } return v; };
  return {
    TS, offset: () => off,
    newKey: p => D.push(D.ref(db, p)).key,
    async get(p) { return (await D.get(D.ref(db, p))).val(); },
    set: (p, v) => D.set(D.ref(db, p), fix(v)),
    update: (p, obj) => D.update(D.ref(db, p), fix(obj)),
    async push(p, v) { const r = D.push(D.ref(db, p)); await D.set(r, fix(v)); return r.key; },
    remove: p => D.remove(D.ref(db, p)),
    on: (p, cb) => D.onValue(D.ref(db, p), s => cb(s.val())),
    async tx(p, fn) { const r = await D.runTransaction(D.ref(db, p), cur => { const nv = fn(cur); return nv === undefined ? undefined : fix(nv); }); return r.committed; },
    presence(p) {
      D.onValue(D.ref(db, ".info/connected"), s => { if (s.val()) { D.onDisconnect(D.ref(db, p)).set(false); D.set(D.ref(db, p), true); } });
    },
    connected(cb) { D.onValue(D.ref(db, ".info/connected"), s => cb(!!s.val())); },
  };
}

/* 쓰기가 실패하면 조용히 넘어가지 않고 알려요 (B7) */
function guard(st) {
  for (const k of ["set", "update", "push", "remove", "tx"]) {
    const f = st[k];
    st[k] = (...a) => Promise.resolve().then(() => f(...a)).catch(e => { toast("저장하지 못했어요. 인터넷 연결을 확인해 주세요.", true); console.error(e); throw e; });
  }
  return st;
}

let S; // store
const now = () => Date.now() + S.offset();

/* ===================== 알림음 · 진동 · 토스트 ===================== */
let actx = null;
function unlockAudio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } if (actx && actx.state === "suspended") actx.resume(); }
addEventListener("pointerdown", unlockAudio, {passive: true});
function chime(kind = "soft") {
  const pattern = {soft: [[660, .12]], alert: [[880, .14], [0, .06], [880, .14], [0, .06], [1175, .22]], end: [[523, .18], [392, .3]]}[kind];
  if (actx) { let t = actx.currentTime;
    for (const [f, d] of pattern) { if (f) { const o = actx.createOscillator(), g = actx.createGain(); o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.25, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + .02); } t += d; } }
  try { navigator.vibrate && navigator.vibrate(kind === "alert" ? [180, 80, 180, 80, 260] : 120); } catch {}
}
function toast(msg, red = false, ms = 3600) {
  const el = document.createElement("div"); el.className = "toast" + (red ? " red" : ""); el.textContent = msg;
  $("#toasts").appendChild(el); setTimeout(() => el.remove(), ms);
}

    <textarea readonly style="min-height:40dvh;font-size:13px!important" id="exText"></textarea>

const entries = o => Object.entries(o || {});
/* 이름: 지금 참가자 → 밀담방·메시지에 남겨 둔 이름(D4) 순서로 찾아요 */
const nameOf = (id, c) => id === "GM" ? "GM" : (R?.players?.[id]?.name || c?.names?.[id] || "(나간 사람)");

async function sysMsg(cid, text, alert = false) { await S.push(`${roomPath()}/messages/${cid}`, {from: "SYS", text, at: S.TS, alert}); }
async function say(cid, from, text) { await S.push(`${roomPath()}/messages/${cid}`, {from, n: from === "GM" ? "GM" : nameOf(from), text, at: S.TS}); }

/* ---------- '밀담 중' 표시 잡기·풀기 (B1·B3) ----------
   참가자 한 명씩 트랜잭션으로 잡아서, 0.1초 차이로 두 요청을 수락해도 한 사람이 두 방에 들어가지 않아요. */
const claimBusy = (x, cid) => S.tx(`${roomPath()}/players/${x}`, p => (!p || p.busy) ? undefined : {...p, busy: cid});
const releaseBusy = (x, cid) => S.tx(`${roomPath()}/players/${x}`, p => { if (!p || p.busy !== cid) return undefined; const {busy, ...rest} = p; return rest; });

/* 밀담방 열기: 요청 수락·GM 열기·GM 대신 시작 모두 여기로 와요 */
async function openChat(mem, o = {}) {
  const players = await S.get(`${roomPath()}/players`) || {};
  const gone = mem.filter(x => !players[x]);
  if (gone.length) return {ok: false, why: "방을 나간 참가자가 있어요"};
  const busyNow = mem.filter(x => players[x].busy);
  if (busyNow.length) return {ok: false, why: `${busyNow.map(x => players[x].name).join(", ")} 님이 이미 밀담 중이에요`};
  const meta = await S.get(`${roomPath()}/meta`) || {};
  const dur = o.dur || meta.duration || 180;
  const cid = S.newKey(`${roomPath()}/chats`);
  const members = {}, names = {}; mem.forEach(x => { members[x] = true; names[x] = players[x].name; });
  const base = {members, names, status: "starting", at: now(), duration: dur};
  if (o.by) base.by = o.by; if (o.req) base.req = o.req; if (o.gm1) base.gm1 = true;
  await S.set(`${roomPath()}/chats/${cid}`, base);
  const got = [];
  for (const x of mem) {
    if (await claimBusy(x, cid)) { got.push(x); continue; }
    for (const y of got) await releaseBusy(y, cid);
    await S.remove(`${roomPath()}/chats/${cid}`);
    return {ok: false, why: `${names[x]} 님이 이미 밀담 중이에요`};
  }
  const t = now();
  await S.update(`${roomPath()}/chats/${cid}`, {status: "live", startAt: t, endAt: t + dur * 1000, w60: dur <= 60, w10: dur <= 10});
  return {ok: true, cid, dur};
}

const END_TXT = {time: "밀담 시간이 끝났습니다. 모두 방에서 나갔어요.", gm: "GM이 밀담을 종료했습니다.", all: "GM이 모든 밀담을 종료했습니다.", left: "남은 사람이 없어 밀담이 끝났어요."};
async function endChat(cid, reason) {
  let mem = [];
  const ok = await S.tx(`${roomPath()}/chats/${cid}`, c => { if (!c || c.status !== "live") return undefined; mem = Object.keys(c.members || {}); return {...c, status: "ended", endedAt: now(), endReason: reason}; });
  if (!ok) return;
  await sysMsg(cid, END_TXT[reason] || "밀담이 종료되었습니다.", true);
  for (const p of mem) await releaseBusy(p, cid);
}

/* 밀담에서 혼자 나가기 (편의 1). 남은 사람이 1명이면 방이 끝나요. */
async function leaveChat(cid, who, why = "left") {
  let ended = false, rest = [], nm = nameOf(who);
  const ok = await S.tx(`${roomPath()}/chats/${cid}`, c => {
    if (!c || c.status !== "live" || !c.members?.[who]) return undefined;
    nm = c.names?.[who] || nm;
    const members = {...c.members}; delete members[who]; rest = Object.keys(members);
    const left = {...(c.left || {}), [who]: now()};
    if (rest.length < (c.gm1 ? 1 : 2)) { ended = true; return {...c, members, left, status: "ended", endedAt: now(), endReason: "left"}; }
    return {...c, members, left};
  });
  if (!ok) return;
  await sysMsg(cid, why === "kick" ? `${nm} 님이 방에서 나갔어요.` : `${nm} 님이 밀담을 끝내고 나갔어요.`);
  await releaseBusy(who, cid);
  if (ended) { await sysMsg(cid, END_TXT.left, true); for (const y of rest) await releaseBusy(y, cid); }
}

/* '밀담 중' 표시가 실제 밀담과 어긋나면 정리해요 (B3). 2.5초 넘게 계속 어긋날 때만 고쳐요. */
const suspect = {};
function reconcile(only) {
  for (const [x, p] of entries(R?.players)) {
    if (only && x !== only) continue;
    const cid = p.busy; if (!cid) { delete suspect[x]; continue; }
    const c = R.chats?.[cid];
    const bad = !c || c.status === "ended" || (c.status === "starting" && now() - (c.at || 0) > 15000) || (c.status === "live" && !c.members?.[x]);
    if (!bad) { delete suspect[x]; continue; }
    const sp = suspect[x];
    if (sp && sp.cid === cid && performance.now() - sp.t > 2500) { delete suspect[x]; releaseBusy(x, cid); if (c?.status === "starting") S.remove(`${roomPath()}/chats/${cid}`); }
    else if (!sp || sp.cid !== cid) suspect[x] = {cid, t: performance.now()};
  }
}

/* 시간 감시: 참가자·GM 어느 기기든 먼저 감지한 쪽이 처리 (중복 방지) */
async function watchClocks(scope) {
  for (const [cid, c] of liveChats()) {
    if (scope && !scope(c)) continue;
    const rem = c.endAt - now();
    if (rem <= 0) { endChat(cid, "time"); continue; }
    if (rem <= 60000 && !c.w60) { if (await S.tx(`${roomPath()}/chats/${cid}/w60`, v => v ? undefined : true)) sysMsg(cid, "⏰ 1분 남았습니다", true); }
    if (rem <= 10000 && !c.w10) { if (await S.tx(`${roomPath()}/chats/${cid}/w10`, v => v ? undefined : true)) sysMsg(cid, "10초 후 자동으로 퇴장됩니다", true); }
  }
}

/* 메시지 목록. 나중에 추가된 사람은 추가된 뒤의 대화만, 먼저 나간 사람은 나가기 전 대화만 봐요 (A3) */
function visibleMsgs(cid, me) {
  const c = R?.chats?.[cid] || {};
  let list = sorted(R?.messages?.[cid]);
  if (me && me !== "GM") {
    const from = typeof c.added?.[me] === "number" ? c.added[me] - 1500 : 0;
    const until = typeof c.left?.[me] === "number" ? c.left[me] + 1500 : Infinity;
    list = list.filter(([, m]) => (m.at || 0) >= from && (m.at || 0) <= until);
  }
  return list;
}
function msgsHTML(cid, me) {
  const c = R?.chats?.[cid] || {};
  const list = visibleMsgs(cid, me);
  if (!list.length) return `<p class="muted center small">아직 대화가 없어요.</p>`;
  return list.map(([, m]) => {
    if (m.from === "SYS") return `<div class="msg sys${m.alert ? " alert" : ""}">${esc(m.text)}</div>`;
    const cls = m.from === me ? "me" : m.from === "GM" ? "gm" : "";
    const who = m.from === "GM" ? "GM" : (R?.players?.[m.from]?.name || m.n || nameOf(m.from, c));
    return `<div class="msg ${cls}"><span class="by">${esc(who)} · ${hhmm(m.at)}</span>${esc(m.text)}</div>`;
  }).join("");
}
function paintMsgs(el, cid, me) {
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  const html = msgsHTML(cid, me); if (el._h === html) return; el._h = html; el.innerHTML = html;
  if (atBottom || !el._init) { el.scrollTop = el.scrollHeight; el._init = true; }
}

/* ---------- 투표 ---------- */
const votesSorted = () => entries(R?.votes).sort((a, b) => (b[1].at || 0) - (a[1].at || 0));
const curVote = () => votesSorted()[0] || null;
function tally(v) {
  const opts = v.opts || []; const cnt = opts.map(() => 0); const who = opts.map(() => []);
  for (const [p, b] of entries(v.ballots)) { const i = b?.o; if (i >= 0 && i < opts.length) { cnt[i]++; who[i].push(b.n || nameOf(p)); } }
  const max = Math.max(0, ...cnt);
  return {opts, cnt, who, max, total: cnt.reduce((a, b) => a + b, 0)};
}
function resultHTML(v, showWho) {
  const t = tally(v);
  if (!t.total) return `<p class="muted small">아무도 투표하지 않았어요.</p>`;
  return t.opts.map((o, i) => {
    const pct = Math.round(100 * t.cnt[i] / t.total);
    return `<div class="bar ${t.cnt[i] === t.max ? "top" : ""}"><i style="width:${pct}%"></i><span>${esc(o)}</span><span class="cnt num">${t.cnt[i]}표</span>
      ${showWho && t.who[i].length ? `<span class="voters">${t.who[i].map(esc).join(", ")}</span>` : ""}</div>`;
  }).join("");
}

/* ---------- 기록 내보내기 (편의 8) ---------- */
function chatLog(cid, me) {
  const c = R.chats[cid];
  const head = `■ ${chatNames(c)} (${hhmm(c.startAt)}~${hhmm(c.endedAt || c.endAt)})`;
  const lines = visibleMsgs(cid, me).map(([, m]) => m.from === "SYS" ? `  (${m.text})` : `  [${hhmm(m.at)}] ${m.from === "GM" ? "GM" : (m.n || nameOf(m.from, c))}: ${m.text}`);
  return [head, ...lines].join("\n");
}
function exportAll() {
  const m = R.meta; const out = [];
  out.push(`밀담방 기록 · ${m.title} (방 코드 ${code})`, `저장한 때: ${new Date().toLocaleString("ko-KR")}`, "");
  out.push("[참가자]", entries(R.players).map(([, p]) => p.name).join(", ") || "-", "");
  const chats = entries(R.chats).filter(([, c]) => c.startAt).sort((a, b) => a[1].startAt - b[1].startAt);
  out.push(`[밀담] ${chats.length}번`);
  chats.forEach(([k]) => out.push(chatLog(k, "GM"), ""));
  const qs = sorted(R.questions);
  if (qs.length) { out.push("[GM에게 온 질문]"); qs.forEach(([, q]) => out.push(`[${hhmm(q.at)}] ${nameOf(q.from)}: ${q.text}`, `   → ${q.answer || "(답 없음)"}`)); out.push(""); }
  const ns = sorted(R.notices);
  if (ns.length) { out.push("[공지]"); ns.forEach(([, n]) => out.push(`[${hhmm(n.at)}] ${n.text}`)); out.push(""); }
  const vs = votesSorted().reverse();
  if (vs.length) {
    out.push("[투표]");
    vs.forEach(([, v]) => { const t = tally(v); out.push(`· ${v.q} (${hhmm(v.at)})`); t.opts.forEach((o, i) => out.push(`   ${o}: ${t.cnt[i]}표${t.who[i].length ? " — " + t.who[i].join(", ") : ""}`)); });
  }
  return out.join("\n");
}

/* ===================== 플레이어 ===================== */
let pid = null, P = {view: null, inChat: null, warned: {}, answered: {}, qRead: {}, notices: null, reqSeen: {}, pick: new Set(), wasMember: false, voteSeen: null, qDraft: "", buzz: 0, incSig: "", expSent: {}};

function enterAs(k) { idStore.setItem(`mildam_pid_${code}`, k); pid = k; S.presence(`${roomPath()}/online/${pid}`); P.view = null; P.wasMember = false; renderPlayer(); }
async function joinAs(name) {
  name = name.trim(); if (!name) return;
  const same = entries(R?.players).find(([, p]) => p.name === name);
  if (same) {
    if (!confirm(`'${name}'(으)로 이미 들어온 사람이 있어요.\n본인이면 이 폰으로 이어서 들어갈까요? (밀담 기록도 이어져요)`)) return;
    return enterAs(same[0]);
  }
  const k = await S.push(`${roomPath()}/players`, {name, joinedAt: S.TS});
  enterAs(k);
}

function openRequestSheet() {

    <div class="row" style="margin-top:12px"><button class="btn ghost grow" id="rCancel">취소</button><button class="btn primary grow" id="rSend" disabled>요청 보내기</button></div>`);

/* 요청 수락: 수락하는 순간에도 만료·밀담 허용을 다시 확인해요 (A2·B4) */
async function acceptReq(rk) {
  const rp = `${roomPath()}/requests/${rk}`;
  const r0 = await S.get(rp);
  if (!r0 || r0.status !== "pending") return toast("이미 끝난 요청이에요.", true);
  if (now() - (r0.t0 || 0) >= REQ_MS) { await S.update(rp, {status: "expired"}); return toast("요청 시간(60초)이 지났어요.", true); }
  if (!R.meta.open) return toast("지금은 밀담 시간이 아니에요.", true);
  await S.set(`${rp}/accepted/${pid}`, true);
  const r = await S.get(rp);
  const need = [r.from, ...Object.keys(r.to || {})];
  if (r.status === "pending" && need.every(x => r.accepted?.[x])) startFromReq(rk, need);
}
async function startFromReq(rk, need, byGM = false) {
  const rp = `${roomPath()}/requests/${rk}`;
  if (!await S.tx(`${rp}/status`, s => s === "pending" ? "starting" : undefined)) return false;
  const meta = await S.get(`${roomPath()}/meta`);
  if (!byGM && !meta?.open) { await S.update(rp, {status: "failed", why: "GM이 밀담 시간을 닫았어요"}); return false; }
  const res = await openChat(need, {req: rk, by: byGM ? "gm" : undefined});
  await S.update(rp, res.ok ? {status: "started", chat: res.cid} : {status: "failed", why: res.why});
  if (res.ok) await sysMsg(res.cid, `문이 닫혔습니다. 방음 중 · ${durTxt(res.dur)}`);
  return res.ok;
}
const incomingReqs = () => entries(R?.requests).filter(([, r]) => r.status === "pending" && r.to?.[pid] && !r.accepted?.[pid] && now() - (r.t0 || 0) < REQ_MS);
const myOutReq = () => entries(R?.requests).filter(([, r]) => r.from === pid).sort((a, b) => (b[1].t0 || 0) - (a[1].t0 || 0))[0];
const leftTxt = r => `<span class="left" data-left="${r}"></span>`;

/* 공지는 대기실·밀담 화면 어디서든 바로 알려요 (A4) */
function checkNotices() {
  const ns = sorted(R.notices);
  if (P.notices !== null && ns.length > P.notices) { const last = ns.at(-1)[1]; toast("📢 GM 공지: " + last.text, false, 7000); chime("alert"); }
  P.notices = ns.length;
}
function checkVote() {
  const cv = curVote(); const sig = cv ? `${cv[0]}:${cv[1].status}` : "";
  if (P.voteSeen !== null && sig !== P.voteSeen && cv) {
    if (cv[1].status === "open") { chime("alert"); toast("🗳️ 투표가 시작됐어요: " + cv[1].q, false, 6000); }
    if (cv[1].status === "revealed") { chime("alert"); toast("🗳️ 투표 결과가 공개됐어요", false, 5000); }
  }
  P.voteSeen = sig;
}
function myBallot(v) { const b = v?.ballots?.[pid]; return b && b.o >= 0 ? b.o : -1; }
function voteCard(vid, v, compact) {
  const mine = myBallot(v);
  if (v.status === "open") return `<div class="vote"><h3>🗳️ ${esc(v.q)}</h3>
    <p class="small muted" style="margin:0">${mine >= 0 ? `내 선택: <b>${esc(v.opts[mine])}</b> · 마감 전까지 바꿀 수 있어요.` : "아무도 내가 누구를 골랐는지 몰라요. GM이 마감한 뒤 결과를 공개해요."}</p>
    <button class="btn ${mine >= 0 ? "" : "primary"} block" data-vote="${vid}" style="margin-top:8px">${mine >= 0 ? "투표 바꾸기" : "투표하기"}</button></div>`;
  if (v.status === "closed") return compact ? "" : `<div class="vote"><h3>🗳️ ${esc(v.q)}</h3><p class="small muted" style="margin:0">투표가 마감됐어요. ${mine >= 0 ? `내 선택: <b>${esc(v.opts[mine])}</b>. ` : ""}GM이 결과를 공개할 때까지 기다려 주세요.</p></div>`;
  if (v.status === "revealed") return compact ? "" : `<div class="vote"><h3>🗳️ 결과 · ${esc(v.q)}</h3>${resultHTML(v, v.showWho)}</div>`;
  return "";
}
function openVoteSheet(vid) {
  const v = R.votes?.[vid]; if (!v || v.status !== "open") return toast("지금은 투표할 수 없어요.", true);

    <div class="row" style="margin-top:12px"><button class="btn ghost grow" id="vCancel">취소</button><button class="btn primary grow" id="vGo" disabled>이걸로 투표</button></div>`);

    $("#vGo").disabled = sel < 0;
  };

    await S.set(`${roomPath()}/votes/${vid}/ballots/${pid}`, {o: sel, n: nameOf(pid), at: S.TS});
    closeSheet(); toast(`'${v.opts[sel]}'에 투표했어요. 마감 전까지 바꿀 수 있어요.`);
  };
}

function paintLobby() {
  const meta = R.meta, me = R.players[pid];
  $("#pTitle").textContent = meta.title; $("#pName").textContent = me.name;
  $("#pGm").innerHTML = R.gmOnline === true ? `<span class="tally idle"><i></i>GM 접속 중</span>` : R.gmOnline === false ? `<span class="tally off"><i></i>GM 연결 끊김</span>` : "";
  // 투표
  const cv = curVote();
  $("#pVote").innerHTML = cv ? voteCard(cv[0], cv[1]) : "";
  // 공지
  const ns = sorted(R.notices);
  $("#pNotice").innerHTML = ns.slice(-2).reverse().map(([, n]) => `<div class="notice"><span class="small muted">GM 공지 · ${hhmm(n.at)}</span><br>${esc(n.text)}</div>`).join("");
  // 받은 요청 (남은 시간 표시 · 편의 9)
  const incoming = incomingReqs();
  P.incSig = incoming.map(([k]) => k).join();
  for (const [k] of incoming) if (!P.reqSeen[k]) { P.reqSeen[k] = 1; chime("alert"); toast("밀담 요청이 왔어요!"); P.buzz = now(); }
  $("#pReqs").innerHTML = incoming.map(([k, r]) => {
    const others = Object.keys(r.to).filter(x => x !== pid).map(x => nameOf(x));
    return `<div class="req"><div class="row" style="justify-content:space-between"><span><b>${esc(nameOf(r.from))}</b> 님이 밀담을 요청했어요</span>${leftTxt(k)}</div>
      ${others.length ? `<span class="muted small">(함께: ${others.map(esc).join(", ")})</span>` : ""}
      <div class="row" style="margin-top:10px"><button class="btn danger grow" data-dec="${k}">거절</button><button class="btn primary grow" data-acc="${k}">수락</button></div></div>`;
  }).join("");
  // 보낸 요청
  const mine = myOutReq();
  let out = "";
  if (mine) {
    const [k, r] = mine; const age = now() - (r.t0 || 0);
    const names = Object.keys(r.to).map(x => nameOf(x)).join(", ");
    if (r.status === "pending") out = `<div class="req" style="margin-top:12px"><div class="row" style="justify-content:space-between"><span class="small">${esc(names)} 님의 수락을 기다리는 중…</span>${leftTxt(k)}</div>
      <div class="muted small">${Object.keys(r.to).map(x => `${esc(nameOf(x))}: ${r.accepted?.[x] ? "수락" : "대기"}`).join(" / ")}</div>
      <button class="btn sm ghost" data-cancel="${k}" style="margin-top:8px">요청 취소</button></div>`;
    else if (["declined", "expired", "failed", "cancelled"].includes(r.status) && !P.reqSeen["out" + k] && age < 120000) {
      P.reqSeen["out" + k] = 1;
      if (r.status !== "cancelled" || r.why) toast(r.status === "declined" ? `${nameOf(r.by)} 님이 밀담을 거절했어요.` : r.status === "expired" ? "응답이 없어 요청이 취소됐어요." : (r.why || "밀담을 시작할 수 없어요."), true);
    }
  }
  $("#pOut").innerHTML = out;
  const pendingMine = mine && mine[1].status === "pending" && now() - (mine[1].t0 || 0) < REQ_MS;
  $("#reqBtn").disabled = !meta.open || pendingMine || !!me.busy;
  $("#pOpenTxt").textContent = !meta.open ? "지금은 밀담 시간이 아니에요. GM이 열면 요청할 수 있어요." : `한 번에 ${durTxt(meta.duration || 180)} 동안 ${memTxt()}이 비밀로 대화해요. 끝나면 자동으로 나와요.`;
  // 질문
  const qs = myQs(); qs.forEach(([k, q]) => { if (q.answer) P.qRead[k] = 1; });
  const qh = qHTML(qs); if ($("#pQs")._h !== qh) { $("#pQs")._h = qh; $("#pQs").innerHTML = qh; }
  // 참가자
  $("#pPlayers").innerHTML = entries(R.players).map(([k, p]) => `<li><span class="grow"><span class="who">${esc(p.name)}</span>${k === pid ? ` <span class="chip">나</span>` : ""}</span>
    ${p.busy ? `<span class="tally on"><i></i>밀담 중</span>` : R.online?.[k] === false ? `<span class="tally off"><i></i>연결 끊김</span>` : `<span class="tally idle"><i></i>대기</span>`}</li>`).join("");
  // 기록
  const logs = myLogs();
  $("#pLogs").innerHTML = logs.length ? logs.map(([k, c]) => `<button class="btn block ghost" data-log="${k}" style="margin:6px 0;justify-content:space-between">
     <span>${esc(chatNames(c, pid) || "(혼자)")}</span><span class="muted small">${hhmm(c.startAt)}</span></button>`).join("") : `<p class="muted small">끝난 밀담의 대화는 여기서 다시 볼 수 있어요.</p>`;
  if ($("#pickList")) paintPick();
  paintMyQs();
  tickLobby();
}
const myLogs = () => entries(R.chats).filter(([, c]) => c.status === "ended" && (c.members?.[pid] || c.left?.[pid])).sort((a, b) => (b[1].startAt || 0) - (a[1].startAt || 0));

/* 대기실 1초 감시: 요청 남은 시간·만료, 받은 요청 반복 알림 (A2·편의 9) */
function tickLobby() {
  document.querySelectorAll("[data-left]").forEach(el => { const r = R.requests?.[el.dataset.left]; if (!r) return; el.textContent = Math.max(0, Math.ceil((REQ_MS - (now() - (r.t0 || 0))) / 1000)) + "초"; });
  const inc = incomingReqs();
  if (inc.map(([k]) => k).join() !== P.incSig) return paintLobby();
  const mine = myOutReq();
  if (mine && mine[1].status === "pending" && now() - (mine[1].t0 || 0) >= REQ_MS && !P.expSent[mine[0]]) { P.expSent[mine[0]] = 1; S.update(`${roomPath()}/requests/${mine[0]}`, {status: "expired"}); }
  if (inc.length && now() - P.buzz > 10000) { P.buzz = now(); chime("soft"); }
}

/* GM 질문·답변: 로비와 밀담 중 모두에서 확인 */
function myQs() { return entries(R?.questions).filter(([, q]) => q.from === pid).sort((a, b) => (b[1].at || 0) - (a[1].at || 0)); }
function qHTML(qs) {
  return qs.map(([, q]) => `<div class="q"><div class="small muted">${hhmm(q.at)} 내 질문</div>${esc(q.text)}
    <hr class="seam">${q.answer ? `<div><span class="chip gm">GM 답변${q.editedAt ? " · 고침" : ""}</span> ${esc(q.answer)}</div>` : `<div class="muted small">답변을 기다리는 중</div>`}</div>`).join("");
}
function checkAnswers() {
  for (const [k, q] of myQs()) if (q.answer && P.answered[k] !== q.answer) {
    if (P.answered.__init) { chime("alert"); toast((P.answered[k] ? "💬 GM이 답변을 고쳤어요: " : "💬 GM 답변: ") + q.answer, false, 8000); }
    P.answered[k] = q.answer;
  }
  P.answered.__init = 1;
}
function openMyQs() {
  openSheet(`<div class="row" style="justify-content:space-between"><h2>내 질문</h2><button class="btn sm ghost" id="mqClose">닫기</button></div>
    <p class="muted small">GM에게만 보이는 질문과 답변이에요.</p><div id="mqList" style="max-height:58dvh;overflow:auto"></div>
    <button class="btn block" id="mqAsk" style="margin-top:12px">새 질문하기</button>`);
  $("#mqClose").onclick = closeSheet; $("#mqAsk").onclick = () => openAsk();
  paintMyQs();
}
function paintMyQs() {
  const box = $("#mqList"); if (box) {
    const qs = myQs(); qs.forEach(([k, q]) => { if (q.answer) P.qRead[k] = 1; });
    const html = qs.length ? qHTML(qs) : `<p class="muted">아직 보낸 질문이 없어요.</p>`;
    if (box._h !== html) { box._h = html; box.innerHTML = html; }

}
function updQBadge() {

/* 추리노트: 이 기기 브라우저에만 저장 (서버로 보내지 않음) */
const noteKey = () => `mildam_note_${code}_${pid}`;
function loadNote() { try { return JSON.parse(localStorage.getItem(noteKey()) || "{}"); } catch { return {}; } }
let noteTimer = null;
function saveNote(n) {
  clearTimeout(noteTimer);
  const st = $("#noteSaved"); if (st) st.textContent = "저장 중…";
  noteTimer = setTimeout(() => {
    try { localStorage.setItem(noteKey(), JSON.stringify(n)); if ($("#noteSaved")) $("#noteSaved").textContent = "이 폰에 저장됨 · " + hhmm(Date.now()); }
    catch { if ($("#noteSaved")) $("#noteSaved").textContent = "저장하지 못했어요 (브라우저 저장공간을 확인해 주세요)"; }
  }, 400);
}
const SUS = ["모름", "낮음", "중간", "높음"];
function noteText() {
  const n = loadNote(); const out = ["[추리노트]", n.free || "(자유 메모 없음)", ""];
  for (const [k, v] of entries(n.people)) { if (!v.alibi && !v.memo && !v.sus) continue; out.push(`· ${nameOf(k)} (의심도 ${SUS[v.sus || 0]})`); if (v.alibi) out.push(`  알리바이: ${v.alibi}`); if (v.memo) out.push(`  메모: ${v.memo}`); }

}
function myExport() {
  const out = [`밀담방 · ${R.meta.title} · ${nameOf(pid)}`, `저장한 때: ${new Date().toLocaleString("ko-KR")}`, "", noteText(), "", "[내 밀담]"];
  const logs = myLogs().reverse(); if (!logs.length) out.push("(없음)");
  logs.forEach(([k]) => out.push(chatLog(k, pid), ""));
  const qs = myQs().reverse(); if (qs.length) { out.push("[내 질문]"); qs.forEach(([, q]) => out.push(`[${hhmm(q.at)}] ${q.text}`, `   → ${q.answer || "(답 없음)"}`)); }

}
function openNote(tab) {

        return `<div class="suspect s${s}" data-p="${k}">

          <div class="sus">${SUS.map((l, i) => `<button class="l${i} ${i === s ? "on" : ""}" data-sus="${i}">${l}</button>`).join("")}</div>
          <label class="f" style="margin-top:4px">알리바이 · 주장</label><textarea data-f="alibi" placeholder="예: 9시에 신사에 있었다고 함">${esc(v.alibi || "")}</textarea>
          <label class="f">메모</label><textarea data-f="memo" placeholder="수상한 점, 확인할 것">${esc(v.memo || "")}</textarea></div>`;
      }).join("") : `<p class="muted">다른 참가자가 들어오면 여기에 인물별 칸이 생겨요.</p>`;
      body.oninput = e => { const ta = e.target.closest("textarea[data-f]"); if (!ta) return; const k = ta.closest("[data-p]").dataset.p; (n.people[k] ||= {})[ta.dataset.f] = ta.value; saveNote(n); };
      body.onclick = e => {

function renderPlayer() {
  if (!R || !R.meta) { P.view = "none"; $("#app").innerHTML = `<div class="wrap"><section class="panel center"><h2>방을 찾을 수 없어요</h2><p class="muted">코드를 다시 확인하거나 GM에게 새 링크를 받아주세요.</p><a class="btn" href="?${DQ.slice(1)}">처음으로</a></section></div>`; return; }
  if (!pid || !R.players?.[pid]) {
    if (pid && P.wasMember) { toast("GM이 방에서 내보냈어요.", true); idStore.removeItem(`mildam_pid_${code}`); pid = null; P.wasMember = false; }
    if (P.view !== "join") viewJoin(R.meta); else paintJoin();
    return;
  }
  P.wasMember = true;
  checkAnswers(); checkNotices(); checkVote();
  reconcile(pid);
  const my = liveChats().find(([, c]) => c.members?.[pid]);
  if (my) {
    const [cid] = my;
    if (P.view !== "chat:" + cid) {
      closeSheet(); shellChat(cid);
      const viaGM = my[1].by === "gm" || my[1].added?.[pid]; chime(viaGM ? "alert" : "soft");
      if (my[1].added?.[pid]) toast("🔔 GM이 진행 중인 밀담방에 추가했어요", true, 4500);
      else if (my[1].gm1) toast("🔔 GM이 1:1 대화를 열었어요", true, 4500);
      else if (my[1].by === "gm") toast("🔔 GM이 밀담방으로 불렀어요", true, 4500);
    }
    P.inChat = cid; paintChat(cid);
  } else {
    if (P.inChat) {
      const c = R.chats?.[P.inChat];
      toast(c?.left?.[pid] ? "밀담에서 나왔어요." : c?.endReason === "gm" || c?.endReason === "all" ? "GM이 밀담을 종료했어요." : c?.endReason === "left" ? "다른 사람이 모두 나가서 밀담이 끝났어요." : "밀담 시간이 끝나 방에서 나왔어요.", true, 5000); chime("end");
      P.inChat = null;
    }

  }
}

function tickPlayer() {
  if (!R || !pid || !R.players?.[pid]) return;
  if (P.view === "lobby") return tickLobby();
  if (!P.inChat) return;
  const c = R.chats?.[P.inChat]; if (!c || c.status !== "live") return;
  const rem = c.endAt - now(); const el = $("#clock");
  if (el) { el.textContent = fmt(rem); el.classList.toggle("warn", rem <= 60000); }
  // 남은 시간 기준 알림: 연장 뒤 다시 1분이 남아도, 마지막 1분에 추가된 사람에게도 맞게 울려요 (D2)
  const w = P.warned[P.inChat] ||= {};
  if (rem <= 60000 && rem > 10000 && c.duration > 60 && w.m60 !== c.endAt) { w.m60 = c.endAt; chime("alert"); toast("⏰ 1분 남았습니다", true); }
  if (rem <= 10000 && rem > 0 && w.s10 !== c.endAt) { w.s10 = c.endAt; chime("soft"); }
  watchClocks(cc => cc.members?.[pid]);
}

/* 내보내기: 진행 중인 요청을 모두 취소하고, 밀담 중이면 방에서 빼요 (B2) */
async function kickPlayer(x) {
  for (const [k, r] of entries(R.requests)) if (r.status === "pending" && (r.from === x || r.to?.[x])) await S.update(`${roomPath()}/requests/${k}`, {status: "cancelled", why: `${nameOf(x)} 님이 방을 나가서 요청이 취소됐어요`});
  const cid = R.players?.[x]?.busy; if (cid && R.chats?.[cid]?.status === "live") await leaveChat(cid, x, "kick");
  for (const [vid, v] of entries(R.votes)) if (v.status === "open" && v.ballots?.[x]) await S.remove(`${roomPath()}/votes/${vid}/ballots/${x}`);
  await S.remove(`${roomPath()}/players/${x}`);
}
/* 밀담 허용을 끄면 대기 중인 요청도 함께 취소해요 (B4) */
async function setOpen(on) {
  await S.set(`${roomPath()}/meta/open`, on);
  if (!on) for (const [k, r] of entries(R.requests)) if (r.status === "pending") await S.update(`${roomPath()}/requests/${k}`, {status: "cancelled", why: "GM이 밀담 시간을 닫아서 요청이 취소됐어요"});
}
async function endAll(close) {
  if (close) await setOpen(false);
  for (const [cid] of liveChats()) await endChat(cid, "all");
  toast(close ? "모든 밀담을 끝내고 밀담 시간을 닫았어요." : "모든 밀담을 끝냈어요.");
}

function paintGMPick() {
  const box = $("#gPickList"); if (!box || !G.pick) return;

  for (const id of [...G.pick]) if (!R.players?.[id] || R.players[id].busy) G.pick.delete(id);
  box.innerHTML = ps.length ? ps.map(([k, p]) => {
    const busy = !!p.busy; const sel = G.pick.has(k);
    return `<div class="pick ${sel ? "sel" : ""} ${busy ? "busy" : ""}" data-id="${k}" role="checkbox" aria-checked="${sel}" tabindex="0">
      <input type="checkbox" ${sel ? "checked" : ""} ${busy ? "disabled" : ""} tabindex="-1"><span class="grow who">${esc(p.name)}</span>
      ${busy ? `<span class="chip red">밀담 중</span>` : R.online?.[k] === false ? `<span class="chip">연결 끊김</span>` : ""}</div>`;
  }).join("") : `<p class="muted">아직 들어온 참가자가 없어요.</p>`;
  const n = G.pick.size, go = $("#gpGo");

}

async function gmAddToChat(cid, ids) {
  const players = await S.get(`${roomPath()}/players`) || {};
  const bad = ids.filter(x => !players[x] || players[x].busy);
  if (bad.length) { toast(`${bad.map(x => nameOf(x)).join(", ")} 님은 지금 넣을 수 없어요 (밀담 중이거나 방을 나감).`, true); return false; }
  const got = [];
  for (const x of ids) { if (await claimBusy(x, cid)) got.push(x); else { for (const y of got) await releaseBusy(y, cid); toast(`${nameOf(x)} 님이 방금 다른 밀담에 들어갔어요.`, true); return false; } }
  const t = now();
  const ok = await S.tx(`${roomPath()}/chats/${cid}`, c => {
    if (!c || c.status !== "live") return undefined;
    const members = {...c.members}, added = {...(c.added || {})}, names = {...(c.names || {})};
    ids.forEach(x => { members[x] = true; added[x] = t; names[x] = players[x].name; });
    const nc = {...c, members, added, names}; delete nc.gm1;    // 1:1에 사람을 더하면 보통 밀담이 돼요
    return nc;
  });
  if (!ok) { for (const y of got) await releaseBusy(y, cid); toast("이미 끝난 밀담이에요.", true); return false; }
  await sysMsg(cid, `GM이 ${ids.map(x => nameOf(x)).join(", ")} 님을 밀담에 추가했어요.`);
  return true;
}

  for (const id of [...G.addPick]) if (!R.players?.[id] || R.players[id].busy) G.addPick.delete(id);
  box.innerHTML = cand.length ? cand.map(([k, p]) => {
    const busy = !!p.busy; const sel = G.addPick.has(k);
    return `<div class="pick ${sel ? "sel" : ""} ${busy ? "busy" : ""}" data-id="${k}" role="checkbox" aria-checked="${sel}" tabindex="0">
      <input type="checkbox" ${sel ? "checked" : ""} ${busy ? "disabled" : ""} tabindex="-1"><span class="grow who">${esc(p.name)}</span>
      ${busy ? `<span class="chip red">다른 밀담 중</span>` : R.online?.[k] === false ? `<span class="chip">연결 끊김</span>` : ""}</div>`;
  }).join("") : `<p class="muted small">더 넣을 수 있는 참가자가 없어요.</p>`;
  const n = G.addPick.size, go = $("#gcAddGo");
  go.disabled = !n; go.textContent = n ? `${n}명 추가` : "추가";
}

  $("#gcClose").onclick = () => { G.open = null; closeSheet(); };
  const showAdd = on => { $("#gcAddBox").hidden = !on; $("#gcAddBar").hidden = on; G.addPick = new Set(); paintGMAdd(); };
  $("#gcAddBtn").onclick = () => showAdd(true);

  };

  $("#gcForm").onsubmit = async e => { e.preventDefault(); const t = $("#gcIn").value.trim(); if (!t) return; $("#gcIn").value = ""; await say(cid, "GM", t); };

  paintMsgs($("#gcMsgs"), cid, "GM");
}

/* 밀담 현황: 누가 누구와 몇 번 했는지, 아직 못 한 사람은 누구인지 (편의 7) */
function statHTML() {
  const ps = entries(R.players); if (!ps.length) return `<p class="muted small">참가자가 들어오면 보여요.</p>`;
  const done = entries(R.chats).filter(([, c]) => c.startAt && !c.gm1);
  const cnt = {}, pair = {};
  for (const [, c] of done) {
    const mem = [...new Set([...Object.keys(c.members || {}), ...Object.keys(c.left || {})])];
    for (const a of mem) { cnt[a] = (cnt[a] || 0) + 1; for (const b of mem) if (a !== b) ((pair[a] ||= {})[b] = (pair[a][b] || 0) + 1); }
  }
  return ps.sort((a, b) => (cnt[a[0]] || 0) - (cnt[b[0]] || 0)).map(([k, p]) => {
    const with_ = entries(pair[k]).sort((a, b) => b[1] - a[1]).map(([o, n]) => `${nameOf(o)} ${n}`).join(" · ");
    return `<div class="stat"><span><b>${esc(p.name)}</b><br><span class="muted small">${with_ ? esc(with_) : "아직 아무와도 안 했어요"}</span></span><span class="num ${cnt[k] ? "" : "zero"}">${cnt[k] || 0}회</span></div>`;
  }).join("");
}

function voteGMHTML(vid, v) {
  const t = tally(v); const voted = new Set(Object.keys(v.ballots || {}));
  const not = entries(R.players).filter(([k]) => !voted.has(k)).map(([, p]) => p.name);
  const st = {open: ["투표 중", "on"], closed: ["마감 · 결과 비공개", ""], revealed: ["결과 공개됨", "idle"]}[v.status] || ["", ""];
  const btns = v.status === "open" ? `<button class="btn primary grow" data-va="close" data-vid="${vid}">마감하기</button>`
    : v.status === "closed" ? `<button class="btn grow" data-va="reopen" data-vid="${vid}">다시 열기</button><button class="btn primary grow" data-va="reveal" data-vid="${vid}">득표수만 공개</button>`
    : `<button class="btn grow" data-va="hide" data-vid="${vid}">공개 거두기</button>`;
  return `<section class="panel"><div class="row" style="justify-content:space-between"><h2>🗳️ ${esc(v.q)}</h2><span class="tally ${st[1]}"><i></i>${st[0]}</span></div>
    <p class="muted small">${t.total}명 투표 · 아직 안 한 사람: ${not.length ? not.map(esc).join(", ") : "없음"}</p>
    <p class="muted small" style="margin:0">아래 결과와 누가 누구를 골랐는지는 GM만 봐요.</p>
    ${resultHTML(v, true)}
    <div class="row wrap-row" style="margin-top:10px">${btns}</div>
    ${v.status === "closed" ? `<button class="btn block" data-va="revealwho" data-vid="${vid}" style="margin-top:8px">누가 누구를 골랐는지까지 공개</button>` : ""}
    <div class="row" style="margin-top:8px"><button class="btn sm ghost grow" data-va="new">새 투표 만들기</button><button class="btn sm danger" data-va="del" data-vid="${vid}">지우기</button></div></section>`;
}
// 투표 후보: 방에 들어온 플레이어 전원(GM 제외, 들어온 순서). 아무도 없으면 캐릭터 명단을 써요.
function voteCands() {
  const notGM = n => n && !/^gm$/i.test(n);
  const ps = entries(R.players).filter(([, p]) => notGM(p?.name?.trim()))
    .sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0)).map(([, p]) => p.name.trim());
  return [...new Set(ps.length ? ps : roster().map(s => s.trim()).filter(notGM))];
}
function voteFormHTML() {
  const cand = voteCands(); const n = entries(R.players).length;
  return `<section class="panel"><h2>투표 열기</h2><p class="muted small">열면 플레이어 폰에 알림이 가고, 각자 몰래 투표해요. 마감한 뒤 GM이 결과를 공개해요.</p>
    <label class="f" for="vQ">질문</label><input type="text" id="vQ" maxlength="60" value="범인은 누구일까요?">
    <label class="f" for="vOpts">후보 (한 줄에 하나)</label>
    <p class="muted small" style="margin:0 0 6px">${n ? `들어온 플레이어 ${cand.length}명이 자동으로 올라가요. GM은 빠지고, 누가 새로 들어오거나 나가면 바로 반영돼요. 직접 고치면 고친 내용이 유지돼요.` : "아직 들어온 플레이어가 없어서 캐릭터 명단을 넣었어요. 플레이어가 들어오면 자동으로 바뀌어요."}</p>
    <textarea id="vOpts" style="min-height:160px">${esc(cand.join("\n"))}</textarea>
    <button class="btn sm ghost" data-va="refill" style="margin-top:6px">들어온 플레이어로 다시 채우기</button>
    <div class="row" style="margin-top:10px">${curVote() ? `<button class="btn ghost grow" data-va="cancelnew">취소</button>` : ""}<button class="btn primary grow" data-va="create">투표 열기</button></div></section>`;
}

function paintGM() {
  const m = R.meta; $("#gTitle").textContent = m.title;
  const live = liveChats();
  const gl = $("#gLive"); gl.className = "tally " + (live.length ? "on" : "idle"); gl.innerHTML = `<i></i>${live.length ? `밀담 ${live.length}개 진행 중` : "조용함"}`;
  const bR = $("#bRooms"); const pend = pendingReqs().length; bR.hidden = !live.length && !pend; bR.textContent = live.length + pend;
  const qs = entries(R.questions); const unanswered = qs.filter(([, q]) => !q.answer);
  const bQ = $("#bQs"); bQ.hidden = !unanswered.length; bQ.textContent = unanswered.length;
  const cv = curVote(); const bV = $("#bVote"); bV.hidden = !(cv && cv[1].status === "open"); bV.textContent = cv ? Object.keys(cv[1].ballots || {}).length : "";
  if (G.seenQ === null) G.seenQ = new Set(qs.map(([k]) => k));
  for (const [k, q] of unanswered) if (!G.seenQ.has(k)) { G.seenQ.add(k); chime("alert"); toast(`🔔 ${nameOf(q.from)} 님의 질문: ${q.text}`, true, 6000); if (G.tab !== "qs") flashTitle(true); }
  const old = m.createdAt && now() - m.createdAt > 86400000;
  $("#gOld").innerHTML = old ? `<div class="notice small">만든 지 하루가 넘은 방이에요. 게임이 끝났다면 설정 탭에서 기록을 내보낸 뒤 방을 지워 주세요.</div>` : "";

  if (G.tab === "invite" && $("#gPlayers")) {
    const ps = entries(R.players); $("#pc").textContent = `${ps.length}명`;
    $("#gPlayers").innerHTML = ps.length ? ps.map(([k, p]) => `<li><span class="grow who">${esc(p.name)}</span>
      ${p.busy ? `<span class="tally on"><i></i>밀담 중</span>` : R.online?.[k] === false ? `<span class="tally off"><i></i>연결 끊김</span>` : `<span class="tally idle"><i></i>대기</span>`}
      <button class="btn sm ghost" data-kick="${k}" aria-label="${esc(p.name)} 내보내기">내보내기</button></li>`).join("") : `<li class="muted">아직 아무도 들어오지 않았어요.</li>`;
  }
  if (G.tab === "rooms" && $("#gLiveList")) {
    const pr = pendingReqs();
    $("#gReqs").innerHTML = pr.length ? pr.map(([k, r]) => `<div class="req"><div class="row" style="justify-content:space-between"><span><b>${esc(nameOf(r.from))}</b> → ${Object.keys(r.to || {}).map(x => esc(nameOf(x))).join(", ")}</span><span class="left" data-left="${k}"></span></div>
      <div class="muted small">${Object.keys(r.to || {}).map(x => `${esc(nameOf(x))}: ${r.accepted?.[x] ? "수락" : "대기"}`).join(" / ")}</div>
      <div class="row" style="margin-top:8px"><button class="btn sm ghost grow" data-rcancel="${k}">취소</button><button class="btn sm primary grow" data-rstart="${k}">대신 시작</button></div></div>`).join("") : `<p class="muted small">플레이어끼리 보낸 요청이 여기에 보여요. 대신 시작하거나 취소할 수 있어요.</p>`;
    $("#gLiveList").innerHTML = live.length ? live.map(([k, c]) => {
      const rem = c.endAt - now(); const last = sorted(R.messages?.[k]).filter(([, x]) => x.from !== "SYS").at(-1)?.[1];
      const lastTxt = last ? `${last.from === "GM" ? "GM" : (last.n || nameOf(last.from, c))}: ${last.text.length > 60 ? last.text.slice(0, 60) + "…" : last.text}` : "";
      return `<div class="case live"><div class="row" style="justify-content:space-between"><span class="tally on"><i></i>${c.gm1 ? "1:1 대화" : "방음 중"}</span><span class="t num ${rem <= 60000 ? "warn" : ""}" data-clock="${k}">${fmt(rem)}</span></div>
        <div class="who" style="margin:6px 0">${esc(chatNames(c))}</div>
        <div class="muted small" style="min-height:20px">${last ? esc(lastTxt) : "아직 대화 없음"}</div>
        <div class="row" style="margin-top:10px"><button class="btn sm grow" data-view="${k}">듣기 · 말하기</button><button class="btn sm" data-add="${k}" aria-label="인원 추가">＋사람</button><button class="btn sm" data-ext="${k}">+1분</button><button class="btn sm danger" data-stop="${k}">종료</button></div></div>`;
    }).join("") : `<p class="muted">지금은 진행 중인 밀담이 없어요.</p>`;
    $("#gEndAll").disabled = !live.length;
    $("#gStatT").textContent = G.statOpen ? "접기" : "펼치기";
    $("#gStat").innerHTML = G.statOpen ? statHTML() : `<p class="muted small">누가 누구와 몇 번 밀담했는지, 아직 못 한 사람이 누구인지 보여요.</p>`;
    const ended = entries(R.chats).filter(([, c]) => c.status === "ended").sort((a, b) => (b[1].startAt || 0) - (a[1].startAt || 0));
    $("#gEnded").innerHTML = ended.length ? ended.map(([k, c]) => `<button class="btn block ghost" data-view="${k}" style="margin:6px 0;justify-content:space-between"><span>${esc(chatNames(c))}</span><span class="muted small">${hhmm(c.startAt)}</span></button>`).join("") : `<p class="muted small">끝난 밀담의 대화가 여기에 쌓여요. 게임 후 복기할 때 보여주세요.</p>`;
  }
  if (G.tab === "qs" && $("#gQs")) {
    // 질문 목록 내용이 실제로 바뀔 때만 다시 그려요. 다른 방 채팅 때문에 답변 입력창이 새로 만들어지지 않아요 (A1)
    const list = qs.sort((a, b) => (!!a[1].answer - !!b[1].answer) || (b[1].at || 0) - (a[1].at || 0));
    const html = list.length ? list.map(([k, q]) => {
      const editing = G.editQ === k;
      return `<div class="q ${q.answer ? "" : "new"}"><div class="small muted"><b>${esc(nameOf(q.from) === "(나간 사람)" && q.n ? q.n : nameOf(q.from))}</b> · ${hhmm(q.at)}</div><div style="margin:4px 0 8px">${esc(q.text)}</div>
      ${q.answer && !editing ? `<div><span class="chip gm">답변함${q.editedAt ? " · 고침" : ""}</span> ${esc(q.answer)}</div><button class="btn sm ghost" data-edit="${k}" style="margin-top:6px">답변 고치기·덧붙이기</button>`
        : `<textarea id="ans-${k}" maxlength="300" placeholder="답변 적기"></textarea>
           ${editing ? "" : `<div class="qa">${QUICK.map((t, i) => `<button data-qa="${i}" data-k="${k}">${esc(t)}</button>`).join("")}</div>`}
           <div class="row" style="margin-top:8px">${editing ? `<button class="btn ghost grow" data-editcancel="1">취소</button>` : ""}<button class="btn primary grow" data-ans="${k}">${editing ? "고친 답변 보내기" : "답변 보내기"}</button></div>`}</div>`;
    }).join("") : `<p class="muted">아직 질문이 없어요.</p>`;
    const box = $("#gQs");
    if (box._h !== html) {
      const active = document.activeElement?.id?.startsWith("ans-") ? document.activeElement.id : null;
      const keep = {}; box.querySelectorAll("textarea").forEach(t => keep[t.id] = t.value);
      box._h = html; box.innerHTML = html;
      for (const id in keep) { const t = document.getElementById(id); if (t) t.value = keep[id]; }
      if (active) document.getElementById(active)?.focus();
    }
  }
  if (G.tab === "vote" && $("#gVote")) {
    const vs = votesSorted();
    const html = (!cv || G.newVote ? voteFormHTML() : "") + (cv && !G.newVote ? voteGMHTML(cv[0], cv[1]) : "");
    const box = $("#gVote");
    if (box._h !== html) {
      const keep = {q: $("#vQ")?.value, o: $("#vOpts")?.value};
      box._h = html; box.innerHTML = html;
      if (keep.q !== undefined && $("#vQ")) { $("#vQ").value = keep.q; if (G.optsEdited) $("#vOpts").value = keep.o; }
    }
    const olds = vs.slice(G.newVote ? 0 : 1);
    $("#gVoteOld").innerHTML = olds.length ? olds.map(([k, v]) => `<div class="vote"><h3>${esc(v.q)} <span class="muted small">${hhmm(v.at)}</span></h3>${resultHTML(v, true)}<button class="btn sm danger" data-va="del" data-vid="${k}">지우기</button></div>`).join("") : `<p class="muted small">지난 투표 결과가 여기에 남아요.</p>`;
  }
  if (G.tab === "set" && $("#openBtn")) {
    $("#openBtn").textContent = m.open ? "켜짐" : "꺼짐"; $("#openBtn").className = "btn " + (m.open ? "primary" : "");
    [...$("#gDur").children].forEach(b => b.classList.toggle("on", +b.dataset.s === m.duration));
    const mm = m.maxMem === 0 ? 0 : (m.maxMem || 3);
    [...$("#gMax").children].forEach(b => b.classList.toggle("on", +b.dataset.m === mm));
  }
  paintGMChat(); paintGMPick();
}
let lastRec = 0;
function tickGM() {
  if (!R) return;
  document.querySelectorAll("[data-clock]").forEach(el => { const c = R.chats?.[el.dataset.clock]; if (!c) return; const rem = c.endAt - now(); el.textContent = fmt(rem); el.classList.toggle("warn", rem <= 60000); });
  document.querySelectorAll("[data-left]").forEach(el => { const r = R.requests?.[el.dataset.left]; if (!r) return; const s = Math.ceil((REQ_MS - (now() - (r.t0 || 0))) / 1000); if (s <= 0 && G.tab === "rooms") { el.closest(".req")?.remove(); } else el.textContent = s + "초"; });
  if (G.open) { const c = R.chats?.[G.open]; if (c?.status === "live") $("#gcSub") && ($("#gcSub").textContent = `${c.gm1 ? "1:1 대화" : "방음 중"} · 남은 시간 ${fmt(c.endAt - now())}`); }
  watchClocks();
  if (performance.now() - lastRec > 1000) { lastRec = performance.now(); reconcile(); }
}

/* ===================== 시작 ===================== */
(async () => {
  try { S = guard(DEMO ? demoStore() : await firebaseStore()); }
  catch (e) { $("#app").innerHTML = `<div class="wrap"><section class="panel"><h2>연결하지 못했어요</h2><p class="muted">인터넷 연결을 확인한 뒤 새로고침해 주세요. 계속 안 되면 Firebase 설정값을 확인해 주세요.</p><pre class="small muted">${esc(e.message)}</pre></section></div>`; return; }
  S.connected(setNet);
  if (!code) return viewHome();
  $("#app").innerHTML = `<div class="wrap"><section class="panel center"><p class="muted">방에 연결하는 중…</p></section></div>`;
  const gmKey = params.get("gm");
  let meta = null;
  try { meta = await S.get(`${roomPath()}/meta`); }
  catch (e) { $("#app").innerHTML = `<div class="wrap"><section class="panel center"><h2>방 정보를 받지 못했어요</h2><p class="muted">인터넷 연결을 확인한 뒤 새로고침해 주세요.</p><button class="btn" onclick="location.reload()">새로고침</button></section></div>`; return; }
  if (gmKey && meta && (meta.gmHash ? meta.gmHash === await sha(gmKey) : meta.gmKey === gmKey)) {
    rememberRoom(code, gmKey, meta.title);
    shellGM();
    S.presence(`${roomPath()}/gmOnline`);
    S.on(roomPath(), v => { R = v; if (!R?.meta) { $("#app").innerHTML = `<div class="wrap"><section class="panel center"><h2>방이 삭제됐어요</h2><a class="btn" href="?${DQ.slice(1)}">처음으로</a></section></div>`; return; } paintGM(); });
    setInterval(tickGM, 500);
    return;
  }
  if (gmKey && meta) toast("GM 링크가 맞지 않아 플레이어로 들어왔어요.", true, 5000);
  pid = idStore.getItem(`mildam_pid_${code}`);
  if (pid) S.presence(`${roomPath()}/online/${pid}`);
  S.on(roomPath(), v => { R = v; renderPlayer(); });
  setInterval(tickPlayer, 500);
})();
</script>
